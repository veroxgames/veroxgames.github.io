<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VEROX GAMES — o'ynash</title>
<meta name="description" content="VEROX GAMES: kafe oching, taomlar sotib oling, franchayzing qiling va Game club'ni brauzerda o'ynang." />
<meta name="theme-color" content="#0b0806" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0806; --panel:#17110d; --panel2:#20170f; --line:rgba(246,234,215,.10);
    --cream:#f6ead7; --muted:#a99a88; --gold:#f2b441; --gold2:#ff8a3d;
    --teal:#2dd4bf; --red:#f87171; --green:#4ade80; --r:16px;
  }
  i.ic{font-style:normal}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Inter,system-ui,-apple-system,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;background:var(--bg);color:var(--cream);font-size:15px;line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(900px 500px at 85% -10%,rgba(242,180,65,.14),transparent 60%),
               radial-gradient(760px 500px at -10% 40%,rgba(45,212,191,.07),transparent 62%)}
  h1,h2,h3{font-family:Orbitron,Inter,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;letter-spacing:.02em;line-height:1.2}
  h2{font-size:1.35rem}
  h3{font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  h3 i{color:var(--gold)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  button:disabled{opacity:.45;cursor:not-allowed}
  .muted{color:var(--muted)}
  .hint{font-size:.87rem;color:var(--muted);margin-bottom:10px}
  .mt{margin-top:12px}
  .pos{color:var(--green)!important}
  .neg{color:var(--red)!important}

  /* ---------- ustki panel ---------- */
  .top{position:sticky;top:0;z-index:40;background:rgba(11,8,6,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-family:Orbitron,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;font-weight:800;letter-spacing:.06em;font-size:.92rem;display:flex;align-items:center;gap:8px;margin-right:auto}
  .brand i{color:var(--gold)}
  .brand b{color:var(--gold)}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:100%}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 12px;border-radius:10px;color:var(--muted);white-space:nowrap;font-weight:600;font-size:.9rem;border:1px solid transparent;display:flex;align-items:center;gap:6px}
  .tab.on{color:#1b1007;background:var(--gold)}
  @media (min-width:700px){.tabs{width:auto}}

  main{max-width:1080px;margin:0 auto;padding:18px 16px 90px}

  /* ---------- umumiy komponentlar ---------- */
  .panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0;padding-top:2px}
  .row .info{flex:1;min-width:0}
  .row .name{font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .row .sub{font-size:.84rem;color:var(--muted);margin-top:2px}
  .pr-ed{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 0 14px 52px}
  .pr-ed .input{flex:1;min-width:140px;max-width:240px}
  .pr-ed .pr-lim{width:100%;font-size:.8rem;color:var(--muted)}
  .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(242,180,65,.12);font-size:1.15rem;flex-shrink:0}
  .lv{color:var(--muted);font-weight:500;font-size:.84rem;margin-left:6px}
  .chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.74rem;font-weight:700;background:rgba(255,255,255,.07);color:var(--muted);white-space:nowrap}
  .chip.ok{background:rgba(74,222,128,.14);color:var(--green)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;font-family:Rajdhani,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;font-weight:700;font-size:1rem;letter-spacing:.02em;white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:transform .15s,filter .15s}
  .btn:not(:disabled):hover{filter:brightness(1.12)}
  .btn:not(:disabled):active{transform:scale(.97)}
  .btn-sm{padding:7px 11px;font-size:.92rem}
  .btn-block{width:100%;padding:13px}
  .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1007;border-color:transparent}
  .btn-teal{background:linear-gradient(135deg,var(--teal),#0ea5a4);color:#04201c;border-color:transparent}
  .btn-dim{opacity:.55}
  .btn-ghost{background:transparent}
  .btn-danger{color:var(--red)}
  .bar{height:12px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar.small{height:7px;margin:6px 0}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .45s linear}
  .club .bar i{background:linear-gradient(90deg,var(--teal),#38bdf8)}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .kv div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kv span{display:block;font-size:.76rem;color:var(--muted)}
  .kv b{font-size:1rem}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:center;font-size:.9rem;font-weight:600}
  .seg button small{display:block;font-size:.68rem;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.3}
  .seg button.on{border-color:var(--gold);background:rgba(242,180,65,.14);color:var(--gold)}
  .club .seg button.on{border-color:var(--teal);background:rgba(45,212,191,.12);color:var(--teal)}
  .field{display:flex;gap:8px;flex-wrap:wrap}
  .input{flex:1;min-width:150px;padding:11px 13px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--cream);outline:none;font:inherit}
  .input:focus{border-color:var(--gold)}
  .input.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(248,113,113,.15)}
  .err{color:var(--red);font-size:.85rem;margin-top:6px;width:100%}
  .cd{font-variant-numeric:tabular-nums;color:var(--cream);font-weight:600}
  .cd-line{color:var(--muted);font-size:.92rem}
  .spinning{text-align:center;padding:14px;font-family:Orbitron,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;color:var(--gold);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .checks div{padding:6px 0;font-size:.92rem}
  .checks .no{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.84rem;font-weight:600}
  .head-kv{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- ekranlar ---------- */
  .hero-home{padding:18px 0 6px}
  .hero-home h1{font-size:clamp(2rem,6vw,3.1rem);margin:6px 0 10px}
  .hero-home h1 span{color:var(--gold)}
  .eyebrow{font-family:Rajdhani,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .club .eyebrow{color:var(--teal)}
  .game-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
  @media (max-width:640px){.game-grid{grid-template-columns:1fr}}
  .game-card{text-align:left;padding:22px;border-radius:20px;border:1px solid rgba(242,180,65,.3);background:linear-gradient(145deg,rgba(242,180,65,.16),rgba(255,138,61,.02) 60%,transparent),var(--panel);transition:transform .2s}
  .game-card:hover{transform:translateY(-3px)}
  .game-card.club{border-color:rgba(45,212,191,.3);background:linear-gradient(145deg,rgba(45,212,191,.16),rgba(56,189,248,.02) 60%,transparent),var(--panel)}
  .game-card span{display:block}
  .gc-ico{font-size:1.5rem;color:var(--gold);margin-bottom:8px}
  .game-card.club .gc-ico{color:var(--teal)}
  .gc-title{font-family:Orbitron,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;font-weight:800;font-size:1.2rem}
  .gc-bal{font-family:Orbitron,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;color:var(--gold);margin-top:6px;font-size:1.02rem}
  .game-card.club .gc-bal{color:var(--teal)}
  .gc-sub{color:var(--muted);font-size:.84rem;margin-top:4px}

  .screen-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs button{flex-shrink:0;padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-weight:600;font-size:.88rem;white-space:nowrap}
  .subtabs button.on{color:#1b1007;background:var(--gold);border-color:transparent}
  .club .subtabs button.on{background:var(--teal);color:#04201c}

  .live-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .badge{font-family:Rajdhani,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji",sans-serif;font-weight:700;letter-spacing:.08em;color:var(--green)}
  .badge::before{content:"● ";animation:pulse 1s infinite}
  .club .badge{color:var(--teal)}
  .live .meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);margin:10px 0}
  .live .kv{margin-top:6px}
  .feed{display:grid;gap:6px;margin-top:12px}
  .feed div{font-size:.86rem;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
  .feed div.new{animation:pop .35s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:640px){.ach-grid{grid-template-columns:1fr}}
  .ach-row{display:flex;gap:10px;align-items:flex-start;padding:11px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
  .ach-row.got{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.05)}
  .ach-row .e{font-size:1.3rem;line-height:1.2}
  .ach-row .n{font-weight:600;font-size:.92rem}
  .ach-row .d{font-size:.8rem;color:var(--muted)}
  .ach-row .r{font-size:.8rem;color:var(--gold);margin-top:2px}

  .help h3{margin:18px 0 8px;color:var(--gold)}
  .help p,.help li{color:var(--cream);font-size:.93rem;margin-bottom:8px}
  .help ul{padding-left:18px}
  .help .muted{color:var(--muted)}

  /* ---------- xabarlar va oyna ---------- */
  .toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:100;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
  .toast{background:#241a12;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:.92rem;animation:tin .25s ease,tout .4s ease 3.2s forwards}
  .toast.good{border-color:rgba(74,222,128,.55)}
  .toast.bad{border-color:rgba(248,113,113,.55)}
  .toast.info{border-color:rgba(242,180,65,.5)}
  @keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(6px)}}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:90;padding:16px}
  .modal[hidden]{display:none}
  .modal-box{width:min(440px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#27190f,#15100b);border:1px solid rgba(242,180,65,.35);border-radius:20px;padding:22px}
  .modal-box h2{margin-bottom:12px;font-size:1.15rem}
  .lines{display:grid;gap:0}
  .lines div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
  .lines div span{color:var(--muted)}
  .lines b{text-align:right}
  .modal-box .hint{margin-top:12px}


  /* ---------- animatsiyalar ---------- */
  .btn,.tab,.subtabs button,.seg button,.game-card,.row,.ach-row,.chip,.pill,.ico{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background-color .25s,border-color .25s,color .25s,filter .15s}
  .btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .btn:not(:disabled):active,.tab:active,.subtabs button:active,.seg button:active,.game-card:active{transform:scale(.93)}
  .tab:hover,.subtabs button:hover,.seg button:hover{transform:translateY(-2px)}
  .seg button:hover{border-color:rgba(242,180,65,.45)}
  .row:hover{background:rgba(255,255,255,.035);transform:translateX(4px);border-radius:12px}
  .row:hover .ico{transform:rotate(-10deg) scale(1.15);background:rgba(242,180,65,.24)}
  .ach-row:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.35)}
  .panel{transition:border-color .3s,box-shadow .3s}
  .panel:hover{border-color:rgba(242,180,65,.28);box-shadow:0 12px 30px rgba(0,0,0,.28)}
  .club .panel:hover{border-color:rgba(45,212,191,.3)}
  .game-card:hover .gc-ico{animation:wiggle .6s ease}
  .game-card:hover{box-shadow:0 16px 36px rgba(0,0,0,.4)}
  .kv div{transition:transform .2s,border-color .2s}
  .kv div:hover{transform:translateY(-2px);border-color:rgba(242,180,65,.35)}
  .pill:hover{transform:scale(1.07)}
  .chip.ok{box-shadow:0 0 0 0 rgba(74,222,128,.4)}
  i.ic{display:inline-block}
  .brand i{animation:floaty 3s ease-in-out infinite}
  .tab.on i{animation:wiggle .6s ease}
  .bar{position:relative}
  .bar i{position:relative;overflow:hidden}
  .bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shim 1.8s linear infinite}
  .eyebrow{animation:glow 3s ease-in-out infinite}
  .hero-home h1 span{display:inline-block;animation:floaty 3.5s ease-in-out infinite}
  .gc-ico{display:inline-block;animation:floaty 3.2s ease-in-out infinite}
  .spinning{animation:pulse 1s infinite,spinwob .8s ease-in-out infinite}
  .modal:not([hidden]){animation:fadein .2s ease}
  .modal-box{animation:zoomin .35s cubic-bezier(.2,1.2,.3,1)}
  .toast{transform-origin:bottom center}
  .toast.bad{animation:tin .25s ease,shake .4s ease .1s,tout .4s ease 3.2s forwards}
  .live .badge{display:inline-block}

  .enter .panel,.enter .game-card,.enter .hero-home,.enter .screen-head,.enter .subtabs,.enter .bar.small{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
  .enter .row,.enter .ach-row,.enter .kv>div,.enter .seg button,.enter .lines>div{animation:slidein .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms + 120ms)}

  .pop{animation:pop2 .4s cubic-bezier(.2,1.4,.4,1)}
  .shake{animation:shake .45s ease}
  .bump{animation:bump .55s ease}

  .ripple{position:fixed;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--gold);background:rgba(242,180,65,.25);pointer-events:none;z-index:120;animation:rip .6s ease-out forwards}
  .club-mode .ripple{border-color:var(--teal);background:rgba(45,212,191,.22)}
  .spark{position:fixed;pointer-events:none;z-index:120;font-size:18px;line-height:1;animation:spark .85s cubic-bezier(.2,.7,.3,1) forwards}

  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes slidein{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
  @keyframes pop2{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22);filter:brightness(1.4)}100%{transform:scale(1)}}
  @keyframes rip{to{transform:scale(6);opacity:0}}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(10deg) scale(1.1)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes shim{to{transform:translateX(100%)}}
  @keyframes glow{50%{opacity:.6}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes zoomin{from{opacity:0;transform:scale(.85) translateY(14px)}to{opacity:1;transform:none}}
  @keyframes spinwob{50%{transform:scale(1.06) rotate(1.5deg)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .pwm{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 2px 2px}
  .pwm i{display:block;height:100%;border-radius:6px;transition:width .25s,background-color .25s}
  .tab.dim{opacity:.35;filter:grayscale(.6);cursor:not-allowed}
  /* ---- Effektlar: silliq o'tishlar va fokus holatlari ---- */
  .panel{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
  .panel:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.35);border-color:rgba(245,190,70,.35)}
  .row{transition:background .2s ease,padding-left .2s ease}
  .row:hover{background:rgba(255,255,255,.03);padding-left:6px}
  .input{transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
  .input:focus{outline:none;border-color:rgba(245,190,70,.7);box-shadow:0 0 0 3px rgba(245,190,70,.18)}
  .btn-gold:not(:disabled):hover{box-shadow:0 0 18px rgba(245,190,70,.35)}
  .btn-gold{position:relative;overflow:hidden}
  .btn-gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-120%)}
  .btn-gold:not(:disabled):hover::after{transform:translateX(120%);transition:transform .7s ease}
  .chip.ok{animation:pop .3s ease both}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    .panel:hover,.row:hover{transform:none;padding-left:inherit}
  }
  /* ---- Jonli fon: kafe (issiq, bug') va club (neon, to'r) ---- */
  .fx-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;transition:background .6s ease;
    background:radial-gradient(ellipse at 20% 0%,rgba(245,158,11,.20),transparent 60%),radial-gradient(ellipse at 90% 100%,rgba(234,88,12,.14),transparent 55%),#140d08}
  body.club-mode .fx-bg{background:radial-gradient(ellipse at 50% 0%,rgba(34,211,238,.18),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(168,85,247,.18),transparent 55%),#070b16}
  .fx-grid{position:absolute;left:-50%;right:-50%;bottom:-6%;height:62%;opacity:0;transition:opacity .6s ease;
    background-image:linear-gradient(rgba(34,211,238,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.28) 1px,transparent 1px);
    background-size:48px 48px;transform:perspective(380px) rotateX(62deg);animation:fxgrid 3.2s linear infinite}
  body.club-mode .fx-grid{opacity:1}
  @keyframes fxgrid{from{background-position:0 0}to{background-position:0 48px}}

const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function wpick(items, weights) {
  const tot = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * tot;
  for (let i = 0; i < items.length; i++) {
    r -= weights[i];
    if (r < 0) return items[i];
  }
  return items[items.length - 1];
}
function sample(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}
// uchburchak taqsimot (random.triangular ning o'xshashi)
function triang(lo, hi, mode) {
  const u = Math.random();
  const c = (mode - lo) / (hi - lo);
  return u < c ? lo + Math.sqrt(u * (hi - lo) * (mode - lo)) : hi - Math.sqrt((1 - u) * (hi - lo) * (hi - mode));
}
const r1000 = (x) => Math.round(x / 1000) * 1000;
const r100 = (x) => Math.round(x / 100) * 100;
const fmt = (n) => {
  n = Math.trunc(n);
  return (n < 0 ? "-" : "") + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm";
};
const sgn = (n) => (n >= 0 ? "+" : "−") + fmt(Math.abs(n));
const mmss = (s) => {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const hm = (s) => {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 3600) + " soat " + Math.floor((s % 3600) / 60) + " daqiqa";
};
const levelOf = (xp) => 1 + Math.floor(Math.sqrt(Math.max(0, xp) / 100));
const xpFor = (lv) => (lv - 1) ** 2 * 100;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayNo = () => Math.floor((Date.now() / 1000 + 5 * 3600) / 86400); // O'zbekiston vaqti bo'yicha kun
const bar = (f) => Math.round(Math.max(0, Math.min(1, f)) * 100);
const dishLine = (keys) => {
  const cnt = {};
  for (const k of keys) cnt[k] = (cnt[k] || 0) + 1;
  return Object.keys(cnt).map((k) => DISHES[k].e + " " + DISHES[k].n + (cnt[k] > 1 ? " ×" + cnt[k] : "")).join(", ");
};

let FX_ON = (() => { try { return localStorage.getItem("kafe-sound-v1") !== "0"; } catch (e) { return true; } })();
let FX_CTX = null;
function fxCtx() {
  if (!FX_CTX) { try { FX_CTX = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (FX_CTX.state === "suspended") FX_CTX.resume().catch(() => {});
  return FX_CTX;
}
function tone(freq, dur, type, vol, delay) {
  const c = fxCtx();
  if (!c || !FX_ON) return;
  const t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  click: () => tone(720, 0.07, "triangle", 0.16),
  tick: () => tone(1100, 0.03, "square", 0.07),
  good: () => { tone(660, 0.12, "sine", 0.12); tone(880, 0.16, "sine", 0.12, 0.1); },
  bad: () => { tone(220, 0.2, "sawtooth", 0.06); tone(180, 0.25, "sawtooth", 0.06, 0.12); },
  info: () => tone(520, 0.1, "sine", 0.1),
};
function sfx(name) { if (SFX[name]) SFX[name](); }
// Fon musiqasi: har bir ekran uchun o'z ohangi (brauzerda sintez, fayl yo'q)
const MUS = {
  calm: { bpm: 84, vol: 0.05, chords: [[261.6, 329.6, 392], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]] },
  cafe: { bpm: 100, vol: 0.06, chords: [[293.7, 369.99, 440], [246.9, 311.1, 370], [220, 277.2, 329.6], [261.6, 329.6, 392]] },
  club: { bpm: 124, vol: 0.07, bass: [55, 55, 65.4, 73.4] },
};
let AMB = null, AMB_WANT = "calm", NOISE = null;
function musNote(c, dest, f, dur, type, vol, t) {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function musPerc(c, dest, t, kind) {
  if (kind === "kick") {
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.22);
    return;
  }
  if (!NOISE) {
    NOISE = c.createBuffer(1, Math.floor(c.sampleRate * 0.2), c.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = NOISE; f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(kind === "open" ? 0.12 : 0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (kind === "open" ? 0.12 : 0.05));
  src.connect(f); f.connect(g); g.connect(dest); src.start(t); src.stop(t + 0.14);
}
function musStep(kind, step, t, c, dest) {
  const m = MUS[kind], eighth = 60 / m.bpm / 2;
  if (kind === "calm") {
    const ch = m.chords[Math.floor(step / 8) % 4];
    musNote(c, dest, ch[step % 3] * (step % 8 < 3 ? 1 : 2), eighth * 1.8, "triangle", 0.5, t);
  } else if (kind === "cafe") {
    if (step % 2 === 0) {
      const ch = m.chords[Math.floor(step / 8) % 4];
      musNote(c, dest, ch[Math.floor(step / 2) % 3] * (step % 4 === 0 ? 1 : 2), eighth * 2.2, "sine", 0.5, t);
    }
    if (step % 4 === 0) musPerc(c, dest, t, "hat");
  } else {
    if (step % 4 === 0) musPerc(c, dest, t, "kick");
    if (step % 2 === 1) musPerc(c, dest, t, "hat");
    if (step % 4 === 2) musPerc(c, dest, t, "open");
    if (step % 8 === 0) musNote(c, dest, m.bass[Math.floor(step / 8) % 4], eighth * 4, "sawtooth", 0.12, t);
  }
}
function musicStart(kind) {
  const c = fxCtx();
  if (!c) return null;
  const g = c.createGain();
  g.gain.value = 0;
  g.connect(c.destination);
  g.gain.setTargetAtTime(MUS[kind].vol, c.currentTime, 0.6);
  const st = { kind, c, g, step: 0, next: c.currentTime + 0.05, timer: null };
  st.timer = setInterval(() => {
    const eighth = 60 / MUS[kind].bpm / 2;
    while (st.next < c.currentTime + 0.15) {
      musStep(kind, st.step, st.next, c, g);
      st.next += eighth; st.step++;
    }
  }, 40);
  return st;
}
function ambStop(fade) {
  if (!AMB) return;
  const a = AMB; AMB = null;
  if (a.timer) clearInterval(a.timer);
  try { a.g.gain.setTargetAtTime(0, a.c.currentTime, 0.3); } catch (e) { /* ignore */ }
  setTimeout(() => { try { a.g.disconnect(); } catch (e) { /* ignore */ } }, fade ? 1200 : 0);
}
function ambient(kind) {
  AMB_WANT = kind;
  if (!FX_ON) { ambStop(false); return; }
  if (AMB && AMB.kind === kind) return;
  ambStop(true);
  AMB = musicStart(kind);
}

/* ===================== KAFE: VAZIFALAR ===================== */
function makeQuests(p) {
  const Sc = incomeScale(p);
  const qs = [];
  for (const kind of sample(Object.keys(QUEST_TYPES), 3)) {
    let n;
    if (kind === "days") n = pick([2, 3]);
    else if (kind === "serve") n = Math.max(20, Math.floor(Math.floor(capacity(p) * 1.5) / 5) * 5);
    else if (kind === "profit") n = Math.max(30000, Math.floor(Sc / 1000) * 1000);
    else n = pick([1, 2]);
    const mult = QUEST_TYPES[kind].mult * (kind === "days" ? n / 2 : 1);
    const reward = Math.max(20000, r1000(Sc * mult));
    qs.push([kind, n, 0, reward, 0]); // tur, maqsad, jarayon, mukofot, olingan
  }
  return qs;
}
function ensureQuests() {
  const p = S.cafe;
  if (!p.quests || p.quests.d !== todayNo()) p.quests = { d: todayNo(), q: makeQuests(p) };
  return p.quests;
}
function questProgress(inc) {
  const data = ensureQuests();
  for (const q of data.q) {
    const v = inc[q[0]] || 0;
    if (v && q[2] < q[1]) q[2] = Math.min(q[1], q[2] + v);
  }
}
function questTitle(q) {
  const t = QUEST_TYPES[q[0]];
  const n = q[0] === "profit" ? fmt(q[1]) : String(q[1]);
  return t.e + " " + t.t.replace("{n}", n);
}
function questStatus(q) {
  const isMoney = q[0] === "profit";
  return isMoney ? fmt(q[2]) + " / " + fmt(q[1]) : q[2] + " / " + q[1];
}
function claimQuest(i) {
  const q = ensureQuests().q[i];
  if (q && q[2] >= q[1] && !q[4]) {
    q[4] = 1;
    S.cafe.money += q[3];
    return q[3];
  }
  return 0;
}

/* ===================== KAFE: YUTUQLAR ===================== */
function checkCafeAch() {
  const p = S.cafe;
  const have = new Set(p.ach);
  const got = [];
  for (const a of ACHS) {
    if (!have.has(a[0]) && a[5](p, p.stats || {})) {
      have.add(a[0]);
      p.money += a[4];
      got.push(a);
    }
  }
  p.ach = [...have];
  return got;
}

function buildCafeDay(start) {  // start: kun boshlanish vaqti (ms), bot bilan bir xil bo'lishi shart
  const p = S.cafe;
  const L = rint(CFG.DAY_MIN, CFG.DAY_MAX);
  const owned = p.dishes.slice();
  const pm = POLICIES[p.policy].price;
  const level = levelOf(p.xp);
  const boosts = p.boosts.slice();
  const mood = wpick(MOODS, MOODS.map((m) => m[2]));

  let demand = 8 + p.ads * 3 + p.decor * 2 + owned.length * 1.5 + level;
  demand *= (0.7 + p.rep * 0.12) * POLICIES[p.policy].demand * mood[1] * rnd(0.85, 1.15);
  demand *= 1 + CFG.PRESTIGE_CUST * p.prestige;
  const incomeK = 1 + CFG.PRESTIGE_INC * p.prestige;
  if (boosts.includes("promo")) demand *= 1.35;
  let D = Math.max(4, Math.round(demand));
  const cap = capacity(p);

  // --- tasodifiy voqealar ---
  const ev = [];
  let burst = null, vipT = null;
  const nEv = wpick([0, 1, 2], [25, 50, 25]);
  const t1 = (a, b) => Math.round(rnd(a, b) * 10) / 10;
  for (const kind of sample(["blogger", "vip", "breakdown", "inspection", "tip", "rush", "complaint", "regular"], nEv)) {
    const t = t1(0.15 * L, 0.8 * L);
    if (kind === "blogger" || kind === "rush") {
      if (burst) continue;
      const extra = Math.max(3, Math.round(D * 0.3));
      burst = [t, extra];
      D += extra;
      ev.push({ t, text: kind === "blogger" ? "🌟 Mashhur bloger kafengizga keldi! Mijozlar oqimi oshdi" : "🍽 Tushlik vaqti! Mijozlar oqimi kuchaydi", money: 0, rep: 0 });
    } else if (kind === "vip") {
      vipT = t;
      ev.push({ t, text: "🎩 VIP mehmon keldi!", money: 0, rep: 0 });
    } else if (kind === "breakdown") {
      if (Math.random() < p.equip * 0.15) continue; // sifatli jihoz buzilmadi
      const fee = 15000 + 8000 * level;
      ev.push({ t, text: `🔧 Qahva mashinasi buzildi! Ta'mir: −${fmt(fee)}`, money: -fee, rep: 0 });
    } else if (kind === "inspection") {
      const amt = 15000 + 5000 * level;
      if (p.decor >= 3) ev.push({ t, text: `🧾 Sanitariya tekshiruvi: hammasi a'lo! Mukofot: +${fmt(amt)}`, money: amt, rep: 0.1 });
      else ev.push({ t, text: `🧾 Tekshiruv kamchilik topdi. Jarima: −${fmt(amt)}`, money: -amt, rep: -0.1 });
    } else if (kind === "complaint") {
      const amt = 8000 + 2000 * level;
      ev.push({ t, text: `😤 Mijoz shikoyat qildi. Pul qaytarildi: −${fmt(amt)}`, money: -amt, rep: -0.03 });
    } else if (kind === "regular") {
      const amt = 12000 + 4000 * level;
      ev.push({ t, text: `🤝 Doimiy mijozlar do'stlari bilan keldi: +${fmt(amt)}`, money: amt, rep: 0.03 });
    } else if (kind === "tip") {
      const amt = 10000 + 3000 * level;
      ev.push({ t, text: `💝 ${pick(NAMES)} katta choychaqa qoldirdi: +${fmt(amt)}`, money: amt, rep: 0 });
    }
  }
  if (boosts.includes("vip") && vipT === null) {
    vipT = t1(0.2 * L, 0.7 * L);
    ev.push({ t: vipT, text: "🎩 Taklif qilingan VIP mehmon keldi!", money: 0, rep: 0 });
  }
  if (boosts.includes("music")) ev.push({ t: Math.round(0.1 * L * 10) / 10, text: "🎷 Jonli musiqa mijozlarga juda yoqdi!", money: 0, rep: 0.05 });

  // --- mijozlar kelish vaqtlari ---
  const nBase = D - (burst ? burst[1] : 0);
  const arr = [];
  for (let i = 0; i < nBase; i++) arr.push(rnd(1, L - 4));
  if (burst) {
    const [bt, extra] = burst;
    for (let i = 0; i < extra; i++) arr.push(rnd(bt, Math.min(L - 4, bt + 0.2 * L)));
  }
  arr.sort((a, b) => a - b);

  const nServed = Math.min(D, cap);
  const lostIdx = new Set(sample([...Array(D).keys()], D - nServed));
  const special = owned.length > 1 ? pick(owned) : null;
  const weights = owned.map((d) => DISHES[d].w * (d === special ? 2 : 1));
  const tipProb = boosts.includes("music") ? 1.0 : 0.3 + 0.04 * p.decor;
  const tipMax = boosts.includes("music") ? 0.24 : 0.12;
  const costK = boosts.includes("chef") ? 0.75 : 1.0;
  const pickDish = () => wpick(owned, weights);

  const makeOrder = (t, name, dishes) => {
    let amount = 0;
    for (const d of dishes) amount += Math.floor((sellPrice(d, pm) * (d === special ? 1.15 : 1)) / 100) * 100;
    amount = Math.floor((amount * incomeK) / 100) * 100;
    if (Math.random() < tipProb) amount += Math.round((amount * rnd(0.03, tipMax)) / 100) * 100; // choychaqa
    const cost = Math.trunc(dishes.reduce((s, d) => s + dishCost(d, p.equip), 0) * costK);
    return { t: Math.round(t * 10) / 10, name, dishes, amount, cost };
  };

  const cust = [], lost = [];
  arr.forEach((t, i) => {
    if (lostIdx.has(i)) {
      lost.push(Math.round(t * 10) / 10);
      return;
    }
    const k = 1 + (Math.random() < 0.45 ? 1 : 0) + (Math.random() < 0.12 ? 1 : 0);
    cust.push(makeOrder(t, pick(NAMES), Array.from({ length: k }, pickDish)));
  });

  // yetkazib berish buyurtmalari
  for (let i = 0; i < p.delivery * 4; i++) {
    const o = makeOrder(rnd(2, L - 4), "🛵 " + pick(NAMES), Array.from({ length: 1 + (Math.random() < 0.4 ? 1 : 0) }, pickDish));
    o.cost += 2000; // kuryer xarajati
    cust.push(o);
  }

  if (vipT !== null) {
    const top = owned.reduce((a, b) => (DISHES[b].sell > DISHES[a].sell ? b : a));
    cust.push(makeOrder(vipT + 1, "VIP mehmon", [top, top, top]));
  }
  cust.sort((a, b) => a.t - b.t);
  ev.sort((a, b) => a.t - b.t);

  return {
    no: p.days + 1, start, end: start + L * 1000, len: L, owner: "site", special, mood: mood[0], cap, boosts,
    cust, lost, ev, rent: 10000 + p.decor * 3000, salary: p.staff * 15000,
  };
}

// Kun boshlanishi (kafe yoki club). Ikkala tomonda bir xil vaqtdan (LEAD_MS keyin) boshlanadi va darhol botga yuboriladi.
async function beginDay(game) {
  const club = game === "club";
  const free = () => (club ? S.club.open && !S.club.day : !S.cafe.day);
  if (dayStarting || !free()) return;
  dayStarting = true;
  try {
    await syncPull();  // avval botdagi yangi holat olinadi: bot allaqachon kun boshlagan bo'lishi mumkin
    if (!free()) return;
    const start = Date.now() + LEAD_MS;
    if (club) { S.club.day = buildClubDay(start); S.club.boosts = []; }
    else { S.cafe.day = buildCafeDay(start); S.cafe.boosts = []; }  // kuchaytirgichlar shu kunda sarflandi
    saveState();
    render();
    syncPushNow(false);  // botga darhol yuboriladi: u ham shu start vaqtda kunni boshlaydi
  } finally { dayStarting = false; }
}

// kun holati: el - o'tgan soniya
function cafeProgress(day, now) {
  const el = Math.min(day.len, Math.max(0, (now - day.start) / 1000));
  const arrived = day.cust.filter((c) => c.t <= el);
  const lostNow = day.lost.filter((t) => t <= el);
  const evNow = day.ev.filter((e) => e.t <= el);
  const rev = arrived.reduce((s, c) => s + c.amount, 0);
  const feed = [];
  for (const c of arrived) feed.push({ t: c.t, text: `👤 ${c.name}: ${dishLine(c.dishes)} — ${fmt(c.amount)}` });
  for (const e of evNow) feed.push({ t: e.t, text: e.text });
  for (const t of lostNow) feed.push({ t, text: "😔 Navbat uzun, mijoz ketib qoldi" });
  feed.sort((a, b) => a.t - b.t);
  return { el, frac: el / day.len, arrived: arrived.length, total: day.cust.length, lost: lostNow.length, rev, feed: feed.slice(-5).reverse() };
}

// kun yakuni: hisob-kitob, natijalar matni
function finishCafeDay() {
  const p = S.cafe;
  const day = p.day;
  if (!day) return;
  const cust = day.cust;
  const served = cust.length, lost = day.lost.length;
  const D = served + lost;
  const rev = cust.reduce((s, c) => s + c.amount, 0);
  const cost = cust.reduce((s, c) => s + c.cost, 0);
  const evDelta = day.ev.reduce((s, e) => s + e.money, 0);
  const evRep = day.ev.reduce((s, e) => s + e.rep, 0);
  const profit = rev - cost + evDelta - day.rent - day.salary;
  pushHist(p, { d: new Date(Date.now() + 5 * 3600000).getUTCDate(), p: Math.round(profit) });

  // reputatsiya
  const oldRep = p.rep;
  let rep = oldRep + evRep;
  const ratio = D ? lost / D : 0;
  if (ratio > 0.25) rep -= Math.min(0.2, ratio * 0.4);
  else if (lost === 0) rep += 0.02 + 0.005 * p.decor;
  rep = Math.round(Math.max(1, Math.min(5, rep)) * 100) / 100;

  // tajriba va daraja
  const oldLv = levelOf(p.xp);
  const xp = p.xp + served + 10;
  const newLv = levelOf(xp);
  let lvReward = 0;
  for (let lv = oldLv + 1; lv <= newLv; lv++) lvReward += 50000 * lv;

  // statistika
  const st = p.stats || {};
  st.served = (st.served || 0) + served;
  st.lost = (st.lost || 0) + lost;
  st.revenue = (st.revenue || 0) + rev;
  st.best = Math.max(st.best || 0, profit);
  st.last_lost = lost;
  st.last_rev = rev;
  st.dishes = st.dishes || {};
  const daySold = {};
  for (const c of cust) for (const d of c.dishes) {
    daySold[d] = (daySold[d] || 0) + 1;
    st.dishes[d] = (st.dishes[d] || 0) + 1;
  }
  st.last_day = { start: day.start, no: day.no, served, lost, rev, profit, by: "site" };  // bot shu kun natijasini ko'rsatishi uchun
  p.stats = st;

  const interest = Math.floor((p.deposit || 0) * (CFG.DEPOSIT_RATE - 1));
  p.money = Math.max(0, p.money + profit + lvReward);
  p.days += 1;
  p.xp = xp;
  p.rep = rep;
  p.deposit = (p.deposit || 0) + interest;
  p.day = null;

  questProgress({ days: 1, serve: served, profit: Math.max(0, profit) });
  const newAch = checkCafeAch();

  const topSold = Object.entries(daySold).sort((a, b) => b[1] - a[1])[0];
  const bad = (lost > 0 && Math.random() < 0.7) || rep < 2.5;
  const review = pick(bad ? BAD_REVIEWS : GOOD_REVIEWS);
  return {
    no: day.no, served, lost, rev, cost, profit, evDelta, rent: day.rent, salary: day.salary, rep, oldRep,
    xpGain: served + 10, interest, lvReward, newLv, oldLv, topSold, review, reviewer: pick(NAMES), newAch,
    money: p.money,
  };
}

function canSpin(spinAt) { return (Date.now() - spinAt) / 1000 >= CFG.SPIN_H * 3600; }
/* ===================== OMAD CHARXI (G'ILDIRAK) ===================== */
// Charxda 10 ta sektor. Yutuq avval hisoblanadi (ehtimol bo'yicha), keyin charx o'sha sektorda to'xtaydi.
// Jekpot ehtimoli: CFG.JACKPOT_BASE + CFG.JACKPOT_STEP × shu o'yindagi franchayzinglar soni (max CFG.JACKPOT_MAX).
const WHEEL_PRIZES = [
  { v: 10000, w: 30, t: "10K" },
  { v: 25000, w: 25, t: "25K" },
  { v: 50000, w: 18, t: "50K" },
  { v: 100000, w: 12, t: "100K" },
  { v: 250000, w: 7, t: "250K" },
  { v: 500000, w: 4, t: "500K" },
  { v: 1000000, w: 2, t: "1M" },
  { v: 3000000, w: 1.3, t: "3M" },
  { v: 10000000, w: 0.7, t: "10M" },
  { v: CFG.JACKPOT_AMT, w: 0, t: "100M", jackpot: true },
];
const WHEEL_COLS = ["#b45309", "#0f766e", "#9a3412", "#6d28d9", "#be123c", "#15803d", "#1d4ed8", "#a16207", "#be185d"];
let WHEEL = { busy: false, rot: 0 };
function jackpotChance(prestige) {
  return Math.min(CFG.JACKPOT_MAX, CFG.JACKPOT_BASE + CFG.JACKPOT_STEP * (prestige || 0));
}
function rollWheel(prestige) {
  const last = WHEEL_PRIZES.length - 1;
  if (Math.random() < jackpotChance(prestige)) return last;
  return wpick([...Array(last).keys()], WHEEL_PRIZES.slice(0, last).map((p) => p.w));
}
function wheelSvg() {
  const N = WHEEL_PRIZES.length, seg = 360 / N, R = 150, C = 160;
  const pt = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  let s = `<defs>
    <radialGradient id="wgHub"><stop offset="0" stop-color="#fff3d1"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
    <linearGradient id="wgJp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  </defs>`;
  WHEEL_PRIZES.forEach((p, i) => {
    const a0 = i * seg, a1 = (i + 1) * seg;
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
    const fill = p.jackpot ? "url(#wgJp)" : WHEEL_COLS[i % WHEEL_COLS.length];
    s += `<path d="M${C} ${C} L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${fill}" stroke="#1b1007" stroke-width="1.5"/>`;
    const mid = a0 + seg / 2, [lx, ly] = pt(mid, R * 0.7);
    s += `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" transform="rotate(${mid} ${lx.toFixed(2)} ${ly.toFixed(2)})" text-anchor="middle" dominant-baseline="middle" font-size="${p.jackpot ? 15 : 14}" font-weight="800" fill="${p.jackpot ? "#3b1f00" : "#fff7e6"}" font-family="Orbitron, Inter, sans-serif">${p.t}</text>`;
  });
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(i * seg, R + 6);
    s += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="3.2" fill="#fde68a"/>`;
  }
  s += `<circle cx="${C}" cy="${C}" r="${R + 10}" fill="none" stroke="#f2b441" stroke-width="4"/>`;
  s += `<circle cx="${C}" cy="${C}" r="26" fill="url(#wgHub)" stroke="#1b1007" stroke-width="3"/>`;
  return s;
}
function setWheelRot(deg) {
  const s = document.getElementById("wheelSvg");
  if (s) s.style.transform = "rotate(" + deg + "deg)";
}
function paintWheel(ov, game) {
  const g = S[game], club = game === "club";
  const ready = canSpin(g.spinAt);
  const left = ready ? "" : hm(CFG.SPIN_H * 3600 - (Date.now() - g.spinAt) / 1000);
  ov.innerHTML = `<div class="modal-box wheel-box">
    <h2>🎡 Omad charxi · ${club ? "Club" : "Kafe"}</h2>
    <p class="hint">🎰 Jekpot ehtimoli: <b>${(jackpotChance(g.prestige) * 100).toFixed(1)}%</b> · ${fmt(CFG.JACKPOT_AMT)}.
      Har franchayzing: +${(CFG.JACKPOT_STEP * 100).toFixed(0)}% (max ${(CFG.JACKPOT_MAX * 100).toFixed(0)}%)</p>
    <div class="wheel-wrap">
      <div class="wheel-pointer" id="wheelPtr"></div>
      <svg id="wheelSvg" class="wheel" viewBox="0 0 320 320">${wheelSvg()}</svg>
    </div>
    <div class="wheel-info" id="wheelInfo"></div>
    ${autoBox(game)}
    <div id="wheelAct">${ready
      ? `<button class="btn btn-gold btn-block" id="wheelGo">🎡 Aylantirish</button>`
      : `<p class="hint">Keyingi aylantirish ${left}dan keyin</p><button class="btn btn-block" id="wheelClose">Yopish</button>`}</div>
  </div>`;
  setWheelRot(WHEEL.rot);
}
function openWheel(game) {
  if (WHEEL.busy) return;
  let ov = document.getElementById("wheelOv");
  if (!ov) {
    ov = document.createElement("div");
    ov.id = "wheelOv";
    ov.className = "modal wheel-ov";
    ov.addEventListener("click", (e) => {
      if (WHEEL.busy) return;
      const id = e.target.id;
      if (e.target === ov || id === "wheelClose") ov.hidden = true;
      else if (id === "wheelGo") runWheel(ov.dataset.game);
    });
    document.body.appendChild(ov);
  }
  ov.dataset.game = game;
  ov.hidden = false;
  paintWheel(ov, game);
}
function runWheel(game) {
  const g = S[game];
  if (WHEEL.busy) return;
  if (!canSpin(g.spinAt)) return toast("🎡 Hali vaqt bo'lmadi", "info");
  WHEEL.busy = true;
  const idx = rollWheel(g.prestige);
  const prize = WHEEL_PRIZES[idx];
  g.money += prize.v;          // yutuq darhol hisobga qo'shiladi (sinxronlash uchun)
  g.spinAt = Date.now();
  saveState();
  render();
  const N = WHEEL_PRIZES.length, seg = 360 / N;
  const theta = idx * seg + seg * (0.2 + 0.6 * Math.random());  // sektor ichida tasodifiy nuqta
  const targetMod = (360 - theta) % 360;
  const cur0 = WHEEL.rot % 360;
  const turns = 5 + Math.floor(Math.random() * 3);
  const from = WHEEL.rot;
  const to = from + ((targetMod - cur0 + 360) % 360) + 360 * turns;
  const dur = 5000 + Math.random() * 1000;
  const t0 = performance.now();
  let last = -1;
  const finish = () => {
    setWheelRot(to);
    WHEEL.rot = to % 360;
    WHEEL.busy = false;
    const info = document.getElementById("wheelInfo"), act = document.getElementById("wheelAct");
    if (info) info.innerHTML = `<div class="wheel-win${prize.jackpot ? " jp" : ""}">${prize.jackpot ? "🎰 JEKPOT! " : "🎉 "}+${fmt(prize.v)}</div>`;
    if (act) act.innerHTML = `<p class="hint">Keyingi aylantirish ${CFG.SPIN_H} soatdan keyin</p><button class="btn btn-gold btn-block" id="wheelClose">Yopish</button>`;
    if (prize.jackpot) SFX.good(); else SFX.info();
    haptic("success");
    if (prize.jackpot) confetti();
    render();
  };
  const step = (now) => {
    const t = Math.min(1, (now - t0) / dur);
    const cur = from + (to - from) * (1 - Math.pow(1 - t, 4));  // silliq sekinlashish
    setWheelRot(cur);
    const under = (((360 - (cur % 360)) % 360) + 360) % 360;   // pointer ostidagi burchak
    const s = Math.floor(under / seg) % N;
    if (s !== last) {
      if (last !== -1) {
        SFX.tick();
        const p = document.getElementById("wheelPtr");
        if (p) { p.classList.remove("tk"); void p.offsetWidth; p.classList.add("tk"); }
      }
      last = s;
    }
    if (t < 1) requestAnimationFrame(step);
    else finish();
  };
  requestAnimationFrame(step);
}
function spinCafe() { openWheel("cafe"); }
function spinClub() { openWheel("club"); }

// Bloklashni faqat bot yozadi: /bans/<login>. Sayt uni o'qib, o'yinni to'xtatadi.

  const acc = loadAccount();
  if (!acc || !FIREBASE_URL) { if (BAN) { BAN = null; render(); } return; }
  try {
    await fbEnsure();
    const r = await fetchT(fbUrl("/bans/" + acc.login + ".json"));

}

/* ===================== KAFE: BANK KREDITI ===================== */
function activeLoans() { return S.loans.filter((l) => l.status === "active"); }
function loanOwed(amount, days) { return r1000(amount * (1 + CFG.LOAN_TERMS[days])); }
function loanLeft(l) { return Math.max(0, l.owed - l.paid); }

// xato matnini qaytaradi, muvaffaqiyatli bo'lsa ""
function takeLoan(amount, days) {
  const p = S.cafe;
  if (!Number.isInteger(amount) || amount < CFG.LOAN_MIN)
    return `Kredit eng kamida ${fmt(CFG.LOAN_MIN)} bo'lishi kerak`;
  if (amount > CFG.LOAN_MAX) return `Kredit eng ko'pi bilan ${fmt(CFG.LOAN_MAX)} bo'lishi mumkin`;
  if (!CFG.LOAN_TERMS[days]) return "Muddat noto'g'ri";
  if (activeLoans().length >= CFG.LOAN_MAX_ACTIVE) return `Bir vaqtda ${CFG.LOAN_MAX_ACTIVE} tadan ortiq faol kredit bo'lmaydi`;
  if (p.trust < CFG.TRUST_MIN) return "Ishonchingiz past: hozircha bank kredit bermaydi";
  const now = Date.now();
  S.loans.push({
    id: S.nextLoan++, amount, owed: loanOwed(amount, days), paid: 0, created: now,
    due: now + days * 86400000, days, warned: false, status: "active",
  });
  p.money += amount;
  return "";
}

function repayLoan(id, want) {
  const l = S.loans.find((x) => x.id === id);
  const p = S.cafe;
  if (!l || l.status !== "active") return "Bu kredit faol emas";
  const pay = Math.min(p.money, loanLeft(l), want);
  if (pay <= 0) return "Hisobingizda pul yetarli emas";
  p.money -= pay;
  l.paid += pay;
  if (loanLeft(l) === 0) l.status = "paid";
  return "";
}

// muddati o'tgan kreditlarni undirish va eslatma (har tikda chaqiriladi)
function collectLoans(now) {
  const p = S.cafe;
  const msgs = [];
  for (const l of S.loans) {
    if (l.status !== "active") continue;
    if (l.due <= now) {
      const rem = loanLeft(l);
      const take = Math.min(p.money, rem);
      const full = take >= rem;
      p.money -= take;
      l.paid += take;
      if (full) p.trust -= 1;
      else {
        p.trust -= 3;
        p.rep = Math.round(Math.max(1, p.rep - 0.5) * 100) / 100;
      }
      l.status = full ? "paid" : "defaulted";
      msgs.push({ kind: full ? "info" : "bad", text: `⏰ Kredit #${l.id} muddati tugadi. Avtomatik to'landi: −${fmt(take)}` +
        (full ? "" : ". To'liq to'lanmadi: 🛡️ −3, ⭐ −0.5") });
    } else if (!l.warned && l.due - now <= CFG.LOAN_REMIND_H * 3600000) {
      l.warned = true;
      msgs.push({ kind: "info", text: `⏰ Eslatma: kredit #${l.id} muddati yaqinlashmoqda. To'lash kerak: ${fmt(loanLeft(l))}` });
    }
  }
  return msgs;
}

// Bot yaratgan kodlar Firebase katalogida (/promo/<o'yin>/<KOD>). Tayyor kodlar (START, CLUB...) brauzerda ham ishlaydi.
const PROMO_NET_MSG = "❌ Internet bilan aloqa yo'q. Qayta urinib ko'ring";
let PROMO_CAT = { cafe: {}, club: {} };
let promoBusy = false;
let authBusy = false;
let SITE_REPL = [];
async function loadSiteRepl() {
  await fbEnsure();
  if (!FIREBASE_URL) return false;
  try {
    const r = await fetchT(fbUrl("/config/site_repl.json"));
    if (!r.ok) return false;

    const list = Object.values(d).filter((x) => x && typeof x.src === "string" && x.src && typeof x.dst === "string");
    const key = JSON.stringify(list);
    const changed = key !== (loadSiteRepl.last || "");
    loadSiteRepl.last = key;
    SITE_REPL = list;
    return changed;
  } catch (e) {
    return false;
  }
}
function applySiteRepl(html) {
  let out = String(html);
  for (const x of SITE_REPL) out = out.split(x.src).join(x.dst);
  return out;
}
async function loadPromoCatalog() {
  await fbEnsure();
  if (!FIREBASE_URL) return false;
  try {
    const r = await fetchT(fbUrl("/promo.json"));
    if (!r.ok) return false;
    const d = (await r.json()) || {};
    PROMO_CAT = {
      cafe: d.cafe && typeof d.cafe === "object" ? d.cafe : {},
      club: d.club && typeof d.club === "object" ? d.club : {},
    };
    return true;
  } catch (e) { return false; }
}
// Kod ta'rifi: avval bot katalogi, bo'lmasa tayyor ro'yxat. expires — millisekund, 0 = muddatsiz.
function promoDef(game, code) {
  const c = PROMO_CAT[game] && PROMO_CAT[game][code];
  if (c && typeof c === "object") {
    return { reward: Number(c.reward) || 0, text: c.text || "Maxsus promokod", expires: Number(c.expires) || 0,
             max: Number(c.max_uses) || 0, used: Number(c.used) || 0, remote: true };
  }
  const b = PROMOS[game][code];
  return b ? { reward: b.reward, text: b.text, expires: 0, max: 0, used: 0, remote: false } : null;
}
// Umumiy hisoblagichni +1 qiladi. Firebase qoidasi used faqat 1 ga oshishiga ruxsat beradi.
// Ikki kishi bir vaqtda bossa, ba'zan bitta ortiqcha ishlatish o'tib ketishi mumkin (kam uchraydi).
async function bumpPromoUsed(game, code) {
  await fbEnsure();
  const url = fbUrl("/promo/" + game + "/" + code + ".json");
  const r = await fetchT(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const cur = await r.json();
  if (!cur || typeof cur !== "object") return true;   // katalogda yo'q: faqat mahalliy kod
  const used = Number(cur.used) || 0;
  if (cur.max_uses && used >= Number(cur.max_uses)) return false;
  const w = await fetchT(url, { method: "PUT", body: JSON.stringify(Object.assign({}, cur, { used: used + 1 })) });
  if (!w.ok) throw new Error("HTTP " + w.status);
  return true;
}
async function redeemPromo(game, raw) {
  const code = (raw || "").trim().toUpperCase();
  if (!/^[A-Z0-9_-]{3,20}$/.test(code)) return { error: "Promokod 3–20 ta lotin harf, raqam, _ yoki - dan iborat bo'lishi kerak" };
  const catOk = await loadPromoCatalog();  // bot yangi kod yaratgan bo'lishi mumkin
  const def = promoDef(game, code);
  if (!def) return { error: catOk ? "❌ Bunday promokod topilmadi" : PROMO_NET_MSG };
  if (S[game].promos.includes(code)) return { error: "❌ Siz bu promokodni allaqachon ishlatgansiz" };
  if (def.expires && Date.now() > def.expires) return { error: "❌ Promokod muddati tugagan." };
  if (def.max && def.used >= def.max) return { error: "❌ Promokod ishlatish limiti tugagan." };
  if (def.remote) {
    let ok;
    try { ok = await bumpPromoUsed(game, code); } catch (e) { return { error: PROMO_NET_MSG }; }
    if (!ok) return { error: "❌ Promokod ishlatish limiti tugagan." };
  }
  S[game].promos.push(code);
  S[game].money += def.reward;
  return { ok: true, text: `🎫 ${def.text}: +${fmt(def.reward)}`, code };
}

// Eski versiyadagi promokod ro'yxati (S.promo) har o'yin holatiga ko'chiriladi: endi u bulutga birga yoziladi

/* ===================== CLUB: VAZIFALAR VA YUTUQLAR ===================== */
function makeClubQuests(c) {
  const seats = Math.max(1, seatsOf(c));
  const Sc = clubScale(c);
  const qs = [];
  for (const kind of sample(Object.keys(CQ_TYPES), 3)) {
    let n;
    if (kind === "days") n = pick([1, 2]);
    else if (kind === "serve") n = Math.max(10, Math.floor(Math.floor(seats * 2) / 5) * 5);
    else if (kind === "hours") n = Math.max(10, Math.floor(Math.floor(seats * 4) / 5) * 5);
    else n = Math.max(30000, Math.floor(Sc / 1000) * 1000);
    const mult = CQ_TYPES[kind].mult * (kind === "days" ? n / 2 : 1);
    const reward = Math.max(20000, r1000(Sc * mult));
    qs.push([kind, n, 0, reward, 0]);
  }
  return qs;
}
function ensureClubQuests() {
  const c = S.club;
  if (!c.quests || c.quests.d !== todayNo()) c.quests = { d: todayNo(), q: makeClubQuests(c) };
  return c.quests;
}
function clubQuestProgress(inc) {
  const data = ensureClubQuests();
  for (const q of data.q) {
    const v = inc[q[0]] || 0;
    if (v && q[2] < q[1]) q[2] = Math.min(q[1], q[2] + v);
  }
}
function clubQuestTitle(q) {
  const t = CQ_TYPES[q[0]];
  const n = q[0] === "profit" ? fmt(q[1]) : String(q[1]);
  return t.e + " " + t.t.replace("{n}", n);
}
function claimClubQuest(i) {
  const q = ensureClubQuests().q[i];
  if (q && q[2] >= q[1] && !q[4]) {
    q[4] = 1;
    S.club.money += q[3];
    return q[3];
  }
  return 0;
}
function checkClubAch() {
  const c = S.club;
  const have = new Set(c.ach);
  const got = [];
  for (const a of CACHS) {
    if (!have.has(a[0]) && a[5](c, c.stats || {})) {
      have.add(a[0]);
      c.money += a[4];
      got.push(a);
    }
  }
  c.ach = [...have];
  return got;
}

/* ===================== CLUB: KUNNI YARATISH ===================== */
function t1(a, b) { return Math.round(rnd(a, b) * 10) / 10; }

function buildClubDay(start) {  // start: kun boshlanish vaqti (ms), bot bilan bir xil bo'lishi shart
  const c = S.club;
  const L = rint(CFG.DAY_MIN, CFG.DAY_MAX);
  const H = CFG.CLUB_HOURS;
  const mach = { std: c.std, pro: c.pro, vip: c.vip, ps: c.ps };
  const seats = seatsOf(c);
  const pol = CPOLICIES[c.policy];
  const boosts = c.boosts.slice();
  let demandK = pol.demand, priceK = pol.price;
  for (const b of boosts) {
    demandK *= CBOOSTS[b].demand;
    priceK *= CBOOSTS[b].price;
  }
  let demand = (3 + 1.8 * seats + 1.2 * c.ads) * (0.6 + c.rep * 0.12) * demandK;
  demand *= (1 + CFG.PRESTIGE_CUST * c.prestige) * rnd(0.85, 1.15);
  const D = Math.max(3, Math.round(demand));
  const incomeK = 1 + CFG.PRESTIGE_INC * c.prestige;

  // --- tasodifiy voqealar ---
  const ev = [];
  const extra = [];
  let outage = null;
  const nEv = wpick([0, 1, 2], [25, 50, 25]);
  for (const kind of sample(["breakdown", "outage", "burst", "complaint"], nEv)) {
    const t = t1(0.15 * H, 0.8 * H);
    if (kind === "breakdown") {
      // administrator va konditsioner buzilish xavfini kamaytiradi
      if (Math.random() < 0.5 * Math.pow(0.85, c.admin) * (c.cool ? 0.7 : 1.0)) {
        const fee = 30000;
        ev.push({ t, text: `🔧 Kompyuter ishlamay qoldi! Ta'mir: −${fmt(fee)}`, money: -fee, rep: -0.02 });
      }
    } else if (kind === "outage") {
      outage = [t, Math.round((t + 1) * 10) / 10];
      ev.push({ t, text: "⚡ Elektr o'chdi! 1 soat mijoz qabul qilinmaydi", money: 0, rep: -0.05 });
    } else if (kind === "burst") {
      const n = Math.max(3, Math.round(D * 0.4));
      for (let i = 0; i < n; i++) extra.push(rnd(t, Math.min(H - 1, t + 1.5)));
      ev.push({ t, text: "🌟 Mashhur bloger keldi! Mijozlar oqimi oshdi", money: 0, rep: 0.02 });
    } else {
      const amt = 15000;
      ev.push({ t, text: `😤 Mijoz shikoyat qildi. Pul qaytarildi: −${fmt(amt)}`, money: -amt, rep: -0.03 });
    }
  }

  // --- kelish vaqtlari (kechqurun ko'proq) ---
  const arr = [];
  for (let i = 0; i < D; i++) arr.push(triang(0, H - 1, 0.65 * H));
  for (const a of extra) arr.push(Math.min(Math.max(0, a), H - 1));
  arr.sort((a, b) => a - b);

  // --- o'yin joylariga joylashtirish ---
  const zones = ZONE_KEYS.filter((z) => mach[z] > 0);
  const free = {};
  for (const z of zones) free[z] = Array(mach[z]).fill(0);
  const sess = [], lost = [];
  for (let t of arr) {
    t = Math.round(t * 100) / 100;
    if (outage && outage[0] <= t && t < outage[1]) {
      lost.push([t, "outage"]);
      continue;
    }
    if (!zones.length) {
      lost.push([t, "seat"]);
      continue;
    }
    const first = wpick(zones, zones.map((z) => ZONES[z].w));
    const order = [first, ...zones.filter((z) => z !== first).sort((a, b) => ZONES[b].w - ZONES[a].w)];
    const hrs = wpick([1, 2, 3, 4], [40, 35, 15, 10]);
    let spot = null;
    for (const z of order) {
      const i = free[z].findIndex((f) => f <= t);
      if (i >= 0) {
        spot = [z, i];
        break;
      }
    }
    if (!spot) {
      lost.push([t, "seat"]);
      continue;
    }
    const [z, i] = spot;
    const end = Math.min(t + hrs, H);
    const billed = Math.max(1, Math.round(end - t));
    free[z][i] = end;
    const amount = Math.round((ZONES[z].rate * priceK * billed * incomeK) / 100) * 100;
    const power = ZONES[z].power * billed;
    let sAmt = 0, sCost = 0;
    if (c.snack && Math.random() < Math.min(0.8, 0.12 + 0.07 * c.snack)) {
      sAmt = Math.round((rnd(CFG.CLUB_SNACK_RANGE[0], CFG.CLUB_SNACK_RANGE[1]) * incomeK) / 1000) * 1000;
      sCost = Math.trunc(sAmt * CFG.CLUB_SNACK_COST);
    }
    sess.push({ t, name: pick(NAMES), z, billed, amount, power, sAmt, sCost, end: Math.round(end * 100) / 100 });
  }

  ev.sort((a, b) => a.t - b.t);
  return {
    no: c.days + 1, start, end: start + L * 1000, len: L, owner: "site", cap: seats, boosts,
    sess, lost, ev, outage,
    rent: CFG.CLUB_RENT + CFG.CLUB_RENT_PER_PC * seats,
    salary: CFG.CLUB_ADMIN_SALARY * c.admin,
  };
}

function clubProgress(day, now) {
  const el = Math.min(day.len, Math.max(0, (now - day.start) / 1000));
  const frac = el / day.len;
  const g = frac * CFG.CLUB_HOURS; // o'yin soati
  const arrived = day.sess.filter((s) => s.t <= g);
  const lostNow = day.lost.filter((x) => x[0] <= g);
  const busy = day.sess.filter((s) => s.t <= g && g < s.end).length;
  const rev = arrived.reduce((a, s) => a + s.amount + s.sAmt, 0);
  const feed = arrived.map((s) => ({ t: s.t, text: `👤 ${s.name}: ${ZONES[s.z].e} ${ZONES[s.z].n}, ${s.billed} soat — ${fmt(s.amount)}` }));
  for (const e of day.ev) if (e.t <= g) feed.push({ t: e.t, text: e.text });
  feed.sort((a, b) => a.t - b.t);
  return { el, frac, g, arrived: arrived.length, total: day.sess.length, lost: lostNow.length, busy, rev, feed: feed.slice(-5).reverse() };
}

function finishClubDay() {
  const c = S.club;
  const day = c.day;
  if (!day) return null;
  const sess = day.sess;
  const served = sess.length, lostN = day.lost.length;
  const rev = sess.reduce((a, s) => a + s.amount + s.sAmt, 0);
  const power = sess.reduce((a, s) => a + s.power, 0);
  const snackCost = sess.reduce((a, s) => a + s.sCost, 0);
  const evDelta = day.ev.reduce((a, e) => a + e.money, 0);
  const evRep = day.ev.reduce((a, e) => a + e.rep, 0);
  const profit = rev - power - snackCost + evDelta - day.rent - day.salary;
  pushHist(c, { d: new Date(Date.now() + 5 * 3600000).getUTCDate(), p: Math.round(profit) });
  const hours = sess.reduce((a, s) => a + s.billed, 0);

  const oldRep = c.rep;
  const D = served + lostN;
  let rep = oldRep + evRep;
  const ratio = D ? lostN / D : 0;
  if (ratio > 0.25) rep -= Math.min(0.2, ratio * 0.4);
  else if (lostN === 0) rep += 0.02;
  rep = Math.round(Math.max(1, Math.min(5, rep)) * 100) / 100;

  const st = c.stats || {};
  st.served = (st.served || 0) + served;
  st.lost = (st.lost || 0) + lostN;
  st.revenue = (st.revenue || 0) + rev;
  st.hours = (st.hours || 0) + hours;
  st.best = Math.max(st.best || 0, profit);
  st.last_rev = rev;
  st.last_lost = lostN;
  st.last_day = { start: day.start, no: day.no, served, lost: lostN, rev, profit, by: "site" };
  c.stats = st;

  const interest = Math.floor((c.deposit || 0) * (CFG.DEPOSIT_RATE - 1));
  c.money = Math.max(0, c.money + profit);
  c.deposit = (c.deposit || 0) + interest;
  c.days += 1;
  c.rep = rep;
  c.day = null;

  clubQuestProgress({ days: 1, serve: served, hours, profit: Math.max(0, profit) });
  const newAch = checkClubAch();
  return {
    no: day.no, served, lost: lostN, rev, power, snackCost, rent: day.rent, salary: day.salary,
    evDelta, profit, rep, oldRep, interest, money: c.money, newAch,
  };
}

function doClubPrestige() {
  const c = S.club;
  if (!canClubPrestige(c)) return toast("Shartlar bajarilmagan", "bad");
  const n = c.prestige + 1;
  const st = c.stats || {};
  st.last_rev = 0;
  Object.assign(c, {
    prestige: n, money: CFG.CLUB_START_MONEY + 500000 * n, deposit: 0, std: CFG.CLUB_START_PCS,
    pro: 0, vip: 0, ps: 0, snack: 0, ads: 0, admin: 0, cool: 0, rep: 3.0, policy: "normal", boosts: [], stats: st,
  });
  toast(`🏢 Club franchayzingi ${n} boshlandi!`, "good");
  notifyClubAch(checkClubAch());
}

/* ===================== CLUB: BONUS, G'ILDIRAK, OMONAT ===================== */
function claimClubBonus() {
  const c = S.club, now = Date.now();
  const since = (now - c.bonusAt) / 1000;
  if (since < CFG.BONUS_H * 3600) return toast(`🎁 Keyingi club bonusi ${hm(CFG.BONUS_H * 3600 - since)}dan keyin`, "info");
  const streak = since < 48 * 3600 ? c.streak + 1 : 1;
  const amount = Math.round((20000 + 10000 * Math.min(streak, 10) + 3000 * Math.min(c.days, 50)) * eventK());
  c.money += amount;
  c.bonusAt = now;
  c.streak = streak;
  openModal("🎁 Club bonusi", `<div class="lines"><div><span>Bonus</span><b class="pos">+${fmt(amount)}</b></div>
    <div><span>Ketma-ket kunlar</span><b>${streak}</b></div><div><span>Club hisobi</span><b>${fmt(c.money)}</b></div></div>`);
}
function clubDepositAdd(pct) {
  const c = S.club;
  const amt = Math.floor(Math.floor((c.money * pct) / 100) / 1000) * 1000;
  if (amt < 1000) return toast("Omonat uchun club hisobida pul yetarli emas", "bad");
  c.money -= amt;
  c.deposit = (c.deposit || 0) + amt;
  toast(`🏦 Club omonatiga qo'yildi: ${fmt(amt)}`, "good");
}
function clubDepositOut() {
  const c = S.club;
  if ((c.deposit || 0) > 0) {
    c.money += c.deposit;
    toast(`💰 Club hisobiga qaytarildi: ${fmt(c.deposit)}`, "good");
    c.deposit = 0;
  }
}
function notifyClubAch(list) {
  if (!list || !list.length) return;
  const reward = list.reduce((s, a) => s + a[4], 0);
  confetti(); toast("🏅 Club: yangi yutuq: " + list.map((a) => a[2]).join(", ") + ` (+${fmt(reward)})`, "good");
}

/* ===================== EKRANLAR: YORDAMCHILAR ===================== */
const DAY_MS = 86400000;
function btn(label, act, o = {}) {
  const cls = ["btn", o.cls || "", o.small ? "btn-sm" : "", o.block ? "btn-block" : ""].join(" ");
  return `<button class="${cls}" data-act="${act}"${o.dis ? " disabled" : ""}>${label}</button>`;
}
function row(icon, title, sub, right) {
  return `<div class="row"><div class="ico">${icon}</div><div class="info"><div class="name">${title}</div>` +
    `${sub ? `<div class="sub">${sub}</div>` : ""}</div>${right || ""}</div>`;
}
function linesHtml(rows) {
  return `<div class="lines">${rows.map((r) => `<div><span>${r[0]}</span><b class="${r[2] || ""}">${r[1]}</b></div>`).join("")}</div>`;
}
function kvHtml(items) {
  return `<div class="kv">${items.map((r) => `<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div>`;
}
function subtabsHtml(list, active, prefix) {
  return `<nav class="subtabs">${list.map((t) => `<button class="${t[0] === active ? "on" : ""}" data-act="${prefix}:${t[0]}">${t[1]}</button>`).join("")}</nav>`;
}
function errClass(k) { return ui.err && ui.err.k === k ? "invalid" : ""; }
function errLine(k) { return ui.err && ui.err.k === k ? `<div class="err">${esc(ui.err.msg)}</div>` : ""; }
function until(ts) { return `<span class="cd" data-until="${ts}">—</span>`; }

// Har o'yin uchun alohida havola: ?game=cafe&ref=LOGIN yoki ?game=club&ref=LOGIN.
// Mukofot: 1–9 ta taklif uchun REF_BASE, REF_BONUS_FROM-taklifdan boshlab REF_BONUS (har biri).
// Taklifni serverning o'zi sanaydi va jami mukofotni /referrals/<o'yin>/<login> ichidagi pending maydoniga yozadi.
// Sayt faqat shu jami summadan hali balansga qo'shilmagan qismini (pending - refPaid) qo'shadi.
const REF_LINK_KEY = NS + "ref-v1";        // havoladan olingan taklif (ro'yxatdan o'tguncha saqlanadi)
const REF_CLAIM_KEY = NS + "refclaim-v1";  // serverga yuborilishi kerak bo'lgan yangi o'yinchi
function refReward(n) { return n >= CFG.REF_BONUS_FROM ? CFG.REF_BONUS : CFG.REF_BASE; }
function refLink(game, login) {
  return `${location.origin}${location.pathname}?game=${game}&ref=${encodeURIComponent(login)}`;
}
function isTyping() { return !!(document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)); }
// Havola bo'yicha kelgan taklifni eslab qolamiz. Hisobi bor qurilmada taklif e'tiborga olinmaydi.
function captureRef() {
  if (loadAccount()) return;
  const q = new URLSearchParams(location.search);
  const ref = (q.get("ref") || "").trim().toLowerCase();
  if (!LOGIN_OK.test(ref)) return;
  const game = q.get("game") === "club" ? "club" : "cafe";
  try { localStorage.setItem(REF_LINK_KEY, JSON.stringify({ game, ref })); } catch (e) { /* xotira yopiq */ }
}
function savedRef() {
  try { return JSON.parse(localStorage.getItem(REF_LINK_KEY) || "null"); } catch (e) { return null; }
}
// Yangi ro'yxatdan o'tgan o'yinchi taklifini serverga yuboradi. Tarmoq uzilsa, keyinroq qayta yuboriladi.
async function submitReferral(login, uid) {
  const r = savedRef();
  try { localStorage.removeItem(REF_LINK_KEY); } catch (e) { /* ignore */ }
  if (!r || !LOGIN_OK.test(r.ref) || r.ref === login) return;  // o'zini o'zi taklif qilib bo'lmaydi
  try {
    localStorage.setItem(REF_CLAIM_KEY, JSON.stringify({ login, claim: { game: r.game, ref: r.ref, uid, at: Date.now(), dev: getDeviceId(), tg: TG_UID } }));
  } catch (e) { /* ignore */ }
  await flushRefClaim();
}
async function flushRefClaim() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(REF_CLAIM_KEY) || "null"); } catch (e) { p = null; }
  if (!p || !FIREBASE_URL) return;
  try {
    await fbEnsure();
    const r = await fetchT(fbUrl("/ref_claims/" + p.login + ".json"), { method: "PUT", body: JSON.stringify(p.claim) });
    if (r.ok) localStorage.removeItem(REF_CLAIM_KEY);
  } catch (e) { /* keyingi urinishda qayta yuboriladi */ }
}
// Serverdagi taklif natijasini o'qiydi va yangi mukofotlarni balansga qo'shadi
async function refreshReferrals() {
  const acc = loadAccount();
  if (!acc || !FIREBASE_URL) return;
  const login = acc.login;
  const get = async (g) => {
    const r = await fetchT(fbUrl("/referrals/" + g + "/" + login + ".json"));
    const d = r.ok ? await r.json() : null;
    return { count: Number(d && d.count) || 0, pending: Number(d && d.pending) || 0 };
  };
  let cafe, club;
  try {
    await fbEnsure();
    cafe = await get("cafe");
    club = await get("club");
  } catch (e) { return; }
  const now = loadAccount();
  if (!now || now.login !== login) return;  // hisob almashgan bo'lsa, eski natija kerak emas
  const next = { login, cafe, club };
  const shown = JSON.stringify(next) !== JSON.stringify(ui.ref || null);
  ui.ref = next;
  const credited = sy.ready ? creditReferrals() : false;  // avval bulutdagi holat olinadi, keyin mukofot qo'shiladi
  if (credited) saveState();
  if ((credited || (shown && ui.screen === "acc")) && !ui.modalOpen && !isTyping()) render();
}
// Server summasi (pending) va balansga allaqachon qo'shilgan qism (refPaid) o'rtasidagi farqni qo'shadi
function creditReferrals() {
  if (!ui.ref) return false;

  const c = S.cafe, k = S.club;

function copyRef(game) {
  const acc = loadAccount();
  if (!acc) return;
  const url = refLink(game, acc.login);
  const ok = () => toast("🔗 Havola nusxalandi", "good");
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let done = false;
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    ta.remove();
    if (done) ok(); else toast("Havolani qo'lda nusxalang: " + url, "info");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, fallback);
  else fallback();
}

/* ===================== HISOB (sayt + bot) ===================== */
// Ro'yxatdan o'tish: login va parol shu yerda kiritiladi. Parol xeshi (PBKDF2) brauzerda hisoblanib,
// botga yuboriladi. Bot hisobni yaratadi va keyin shu login+parol bilan kirishni tekshiradi.
const LOGIN_OK = /^[a-z0-9_]{3,20}$/;   // bot bilan bir xil qoida
const PBKDF2_ITER = 100000;             // bot.py dagi PBKDF_ITER bilan BIR XIL bo'lishi shart
function loadAccount() {
  try {
    const a = JSON.parse(localStorage.getItem(ACC_KEY) || "null");
    return a && typeof a.login === "string" ? a : null;
  } catch (e) { return null; }
}
function saveAccount(a) {
  try { localStorage.setItem(ACC_KEY, JSON.stringify(a)); } catch (e) { /* saqlanmadi: sahifa ishlayveradi */ }
}
// Hisobni almashtirish: avval eski hisobning oxirgi o'zgarishi bulutga yetishi shart,
// aks holda eski o'yin yangi hisobga yozilib qolishi mumkin.
async function flushBeforeSwitch() {
  if (!syncOn()) return true;
  if (sy.dirty) await syncPushNow(false);
  if (sy.dirty) return false;
  clearTimeout(sy.pushT);
  return true;
}
// Yangi hisob uchun bo'sh o'yin: u sinxronlashni qayta boshlamaydi, bulutdagisi syncPull bilan olinadi
function resetGameLocal(acc) {
  if (acc) saveAccount(acc);
  else { try { localStorage.removeItem(ACC_KEY); } catch (e) { /* ignore */ } }
  clearTimeout(sy.pushT);
  S = freshState();
  ui.ref = null;
  BAN = null;
  sy.dirty = false;
  sy.sig = syncSig();
  sy.ready = false;
  try { localStorage.setItem(GAME_KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
}
// Hisobdan chiqish: bulutdagi o'yin saqlanadi, qurilmadagi nusxa tozalanadi
async function resetAccount() {
  if (authBusy) return;
  authBusy = true;
  try {
    if (!(await flushBeforeSwitch())) {
      ui.err = { k: "logout", msg: "❌ Oxirgi o'zgarish bulutga yetmadi. Internetni tekshirib, qayta urinib ko'ring" };
      return;
    }
    resetGameLocal(null);
    fbAuthSave(null);
    ui.screen = "acc";
    ui.err = null;
    ui.draft.siPass = ""; ui.draft.regPass = ""; ui.draft.regPass2 = "";
  } finally { authBusy = false; render(); }
}
// Kirish: login+parol bo'yicha bulutdagi hisob topiladi (kalit parol xeshidan hosil bo'ladi)
async function doSignIn() {
  if (authBusy) return;
  const login = String(ui.draft.siLogin || "").trim().toLowerCase();
  const pass = String(ui.draft.siPass || "");
  if (!LOGIN_OK.test(login) || !pass) { ui.err = { k: "signin", msg: "Login va parolni to'liq kiriting" }; render(); return; }
  if (!termsAccepted()) { ui.err = { k: "signin", msg: "Davom etish uchun shartlar va maxfiylik siyosatiga rozilik bildiring" }; render(); return; }
  if (!FIREBASE_URL) { ui.err = { k: "signin", msg: "Sayt sozlanmagan: FIREBASE_URL yo'q" }; render(); return; }
  authBusy = true;
  ui.err = null;
  render();
  try {
    if (!(await flushBeforeSwitch())) {  // eski hisobning oxirgi o'zgarishi yetib borsin
      ui.err = { k: "signin", msg: "❌ Oxirgi o'zgarish bulutga yetmadi. Internetni tekshirib, qayta urinib ko'ring" };
      return;
    }
    let auth;
    try { auth = await fbAuthCall("signInWithPassword", login, pass); }
    catch (e) { ui.err = { k: "signin", msg: fbErrText(e) }; return; }
    fbAuthSave(auth);
    const key = await deriveSyncKey(login, await pbkdf2Hex(pass, login));
    const r = await fetchT(fbUrl("/s/" + key + ".json"));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d || !d.cafe) {
      fbAuthSave(null);
      ui.err = { k: "signin", msg: "❌ Bu hisob uchun o'yin ma'lumoti topilmadi. «Ro'yxatdan o'tish» ni tanlang." };
      return;
    }
    resetGameLocal({ login, key, at: Date.now() }); touchDevice(login); refreshBan();
    ui.draft.siPass = "";
    ui.screen = "home";
    await syncPull();
  } catch (e) {
    ui.err = { k: "signin", msg: PROMO_NET_MSG };
  } finally { authBusy = false; render(); }
}

async function pbkdf2Hex(password, login) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: enc.encode("kafe:" + login.toLowerCase()), iterations: PBKDF2_ITER },
    key, 256);
  return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function doRegister() {
  if (authBusy) return;
  const login = String(ui.draft.regLogin || "").trim().toLowerCase();
  const pass = String(ui.draft.regPass || "");
  const pass2 = String(ui.draft.regPass2 || "");
  let msg = null;
  if (!LOGIN_OK.test(login)) msg = "Login 3–20 belgi: faqat a–z, 0–9 va _ belgisi";
  else if (pass.length < 6 || pass !== pass.trim()) msg = "Parol kamida 6 belgi bo'lsin (boshida va oxirida bo'sh joy bo'lmasin)";
  else if (pass !== pass2) msg = "Parollar bir xil emas";
  else if (!FIREBASE_URL) msg = "Sayt sozlanmagan: FIREBASE_URL yo'q";
  else if (!termsAccepted()) msg = "Davom etish uchun shartlar va maxfiylik siyosatiga rozilik bildiring";
  if (msg) { ui.err = { k: "reg", msg }; render(); return; }
  authBusy = true;
  ui.err = null;
  render();
  try {
    if (!(await flushBeforeSwitch())) {
      ui.err = { k: "reg", msg: "❌ Oxirgi o'zgarish bulutga yetmadi. Internetni tekshirib, qayta urinib ko'ring" };
      return;
    }
    let auth;
    try { auth = await fbAuthCall("signUp", login, pass); }
    catch (e) {
      if (/EMAIL_EXISTS/.test(String(e.message))) ui.err = { k: "reg", msg: "❌ Bu login band. Boshqa login tanlang yoki «Kirish» ni bosing." };
      else ui.err = { k: "reg", msg: fbErrText(e) };
      return;
    }
    fbAuthSave(auth);
    const key = await deriveSyncKey(login, await pbkdf2Hex(pass, login));
    const r = await fetchT(fbUrl("/s/" + key + ".json"));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    resetGameLocal({ login, key, at: Date.now() }); touchDevice(login); refreshBan();
    if (d && d.cafe) {
      // Eski (Auth'siz) hisob: ma'lumoti saqlanadi, egalik shu hisobga o'tadi
      await syncPull();
      sy.dirty = true;
      await syncPushNow(false);
    } else {
      S.rev = Date.now();
      const dd = durableOf(S);
      const put = await fetchT(fbUrl("/s/" + key + ".json"), { method: "PUT",
        body: JSON.stringify({ rev: S.rev, by: "site", login, uid: auth.uid, cafe: dd.cafe, club: dd.club }) });
      if (!put.ok) throw new Error("HTTP " + put.status);
      await submitReferral(login, auth.uid);  // yangi o'yinchi: havola orqali taklif
      await syncPull();
    }
    ui.draft.regPass = ""; ui.draft.regPass2 = "";
    ui.screen = "home";
  } catch (e) {
    ui.err = { k: "reg", msg: PROMO_NET_MSG };
  } finally { authBusy = false; render(); }
}
const PW_LEVELS = [["Juda zaif", "#f87171"], ["Zaif", "#fb923c"], ["O'rtacha", "#facc15"], ["Yaxshi", "#a3e635"], ["Kuchli", "#34d399"]];
function pwScore(p) {
  let s = 0;
  if (p.length >= 6) s++;
  if (p.length >= 10) s++;
  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
  if (/\d/.test(p) && /[^A-Za-z0-9]/.test(p)) s++;
  return s; // 0..4
}
function pwMeter(p) {
  if (!p) return "";
  const sc = pwScore(p), [label, color] = PW_LEVELS[sc];
  return `<div class="pwm"><i style="width:${(sc + 1) * 20}%;background:${color}"></i></div>` +
    `<div class="hint">Parol kuchi: ${label}</div>`;
}

  } catch (e) { /* eski Telegram versiyasi */ }
}

async function ownerAct(a, b) {
  if (!isOwner()) return;
  if (a === "ban") return ownerBan(b);
  if (a === "quick") { ui.draft.ownBanLogin = b; return ownerBan("add"); }
  if (a === "list") {
    if (b === "load") { ui.ownPage = 0; return ownerLoadAll(); }
    ui.ownPage = Math.max(0, (ui.ownPage || 0) + (b === "next" ? 1 : -1));
    return;
  }
  if (a === "cadd" || a === "kadd") {
    const n = Number(b) || 0;
    if (a === "cadd") S.cafe.money += n; else S.club.money += n;
    saveState();
    return toast(`${a === "cadd" ? "☕ Kafe" : "🎮 Club"} balansiga ${fmt(n)} qo'shildi`, "good");
  }
  if (a === "promo") {
    const game = b === "club" ? "club" : "cafe";
    const d = ui.draft;
    const code = String(d.ownCode || "").trim().toUpperCase();
    const reward = Math.floor(Number(d.ownReward) || 0), max = Math.max(0, Math.floor(Number(d.ownMax) || 0));
    const days = Math.max(0, Math.floor(Number(d.ownDays) || 0));
    if (!/^[A-Z0-9_-]{3,20}$/.test(code)) return toast("Kod 3–20 ta lotin harf, raqam, _ yoki - bo'lsin", "bad");
    if (reward <= 0) return toast("Mukofot 0 dan katta bo'lsin", "bad");
    if (!FIREBASE_URL) return toast("Firebase ulanmagan", "bad");
    await loadPromoCatalog();
    if (PROMO_CAT[game] && PROMO_CAT[game][code]) return toast("Bu kod allaqachon mavjud", "bad");
    const body = { reward, text: "Ega promokodi", expires: days ? Date.now() + days * 86400000 : 0,
                   max_uses: max, used: 0, created: Date.now() };
    try {
      const r = await fetchT(fbUrl(`/promo/${game}/${code}.json`),
        { method: "PUT", body: JSON.stringify(body) });
      if (!r.ok) throw new Error("http " + r.status);
      await loadPromoCatalog();
      return toast(`🎫 ${code} (${game === "club" ? "Club" : "Kafe"}) yaratildi`, "good");
    } catch (e) {
      return toast(PROMO_NET_MSG, "bad");
    }
  }
}

function mfBotPick(role, self, alive, roles) {
  const pick = (arr) => (arr.length ? arr[Math.floor(Math.random() * arr.length)] : null);
  if (role === "mafia") return pick(alive.filter((id) => id !== self && roles[id] !== "mafia"));
  if (role === "doctor") return pick(alive);
  if (role === "detective") return pick(alive.filter((id) => id !== self));

}
async function mfAddBot() {

async function mfRemoveBots() {

function mfShuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function mfRoles(n) {
  const out = [];
  for (let i = 0; i < Math.max(1, Math.floor(n / 4)); i++) out.push("mafia");
  out.push("doctor");
  if (n >= 5) out.push("detective");
  while (out.length < n) out.push("civ");
  return out;
}

async function mfReq(method, p, body, q) {
  await fbEnsure();
  const o = { method: method || "GET" };
  if (body !== undefined) o.body = JSON.stringify(body);
  const r = await fetchT(fbUrl("/mafia/" + p + ".json" + (q ? "?" + q : "")), o);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.status === 204 ? null : r.json();
}

async function mfJoin(raw) {
  const uid = mfUid();
  if (!uid) return mfErr(mt("needAcc2"));
  const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  if (code.length !== 6) return mfErr(mtE("codeLen"));
  try {
    const room = await mfGet(`rooms/${code}`);
    if (!room) return mfErr(mtE("notFound"));
    const players = room.players || {};
    if (!players[uid]) {
      if (room.mode === "bot") return mfErr(mtE("botRoom"));
      if (room.phase !== "lobby") return mfErr(mtE("started"));
      if (Object.keys(players).length >= MF_MAX) return mfErr(mtE("full", MF_MAX));
      await mfPut(`rooms/${code}/players/${uid}`, { name: mfMyName(), alive: true, seen: Date.now() });
    }
    MF.code = code; MF.err = ""; mfSaveLocal(); ui.draft.mfCode = "";
    await mfRefresh(true);
  } catch (e) { mfErr(mtE("net")); }
}
