async function mfStart() {
  if (!mfIsHost() || !MF.room) return;
  const ids = Object.keys(MF.room.players || {});
  if (ids.length < MF_MIN || ids.length > MF_MAX) return mfErr(mtE("startCount", ids.length, MF_MIN, MF_MAX));
  try {
    const order = mfShuffle(ids), roleList = mfShuffle(mfRoles(ids.length));
    const roles = {};
    order.forEach((id, i) => { roles[id] = roleList[i]; });
    const mafiaIds = order.filter((id) => roles[id] === "mafia");
    const gen = Date.now();
    await Promise.all(order.filter((id) => !MF.room.players[id].bot).map((id) => mfPut(`priv/${MF.code}/${id}`, { role: roles[id], mates: roles[id] === "mafia" ? mafiaIds.filter((x) => x !== id) : [] })));
    MF.roles = roles;
    try { localStorage.setItem(mfHostKey(MF.code), JSON.stringify(roles)); } catch (e) { /* ignore */ }
    const patch = { phase: "night", day: 1, ends: Date.now() + MF_TIME.night * 1000, gen, winner: null, reveal: null, night: null, votes: null, log: null };
    ids.forEach((id) => { patch[`players/${id}/alive`] = true; });
    await mfPatch(`rooms/${MF.code}`, patch);
    await mfLog({ k: "start" });
    await mfRefresh(true);
  } catch (e) { mfErr(mtE("startFail")); }
}

async function mfHostStep(room) {
  const now = Date.now(), code = MF.code, players = room.players || {};
  const alive = Object.keys(players).filter((id) => players[id].alive === true);
  if (room.phase === "night") {
    if (!MF.roles) return mfErr(mtE("noRoles"));
    const night = room.night || {};
    const botActs = alive.filter((id) => players[id].bot && ["mafia", "doctor", "detective"].includes(MF.roles[id]) && !(night[id] && night[id].t));
    if (botActs.length) {
      const upd = {};
      botActs.forEach((id) => {
        const r = MF.roles[id];
        const t = mfBotPick(r, id, alive, MF.roles);
        if (t) upd[id] = { act: r === "mafia" ? "kill" : r === "doctor" ? "save" : "check", t };
      });
      if (Object.keys(upd).length) await mfPatch(`rooms/${code}/night`, upd);
      return;
    }
    const need = alive.filter((id) => ["mafia", "doctor", "detective"].includes(MF.roles[id]));
    const waiting = need.filter((id) => !(night[id] && night[id].t));
    if (now < room.ends && waiting.length) return;
    await mfResolveNight(room, alive);
  } else if (room.phase === "day") {
    if (now >= room.ends) await mfPatch(`rooms/${code}`, { phase: "vote", ends: now + MF_TIME.vote * 1000 });
  } else if (room.phase === "vote") {
    const votes = room.votes || {};
    const botVotes = alive.filter((id) => players[id].bot && !votes[id]);
    if (botVotes.length) {
      const upd = {};
      botVotes.forEach((id) => {
        const cands = alive.filter((x) => x !== id);
        upd[id] = !cands.length || Math.random() < 0.15 ? "skip" : cands[Math.floor(Math.random() * cands.length)];
      });
      await mfPatch(`rooms/${code}/votes`, upd);
      return;
    }
    const waiting = alive.filter((id) => !votes[id]);
    if (now < room.ends && waiting.length) return;
    await mfResolveVote(room, alive);
  }
}

function mfWinner(alive, roles) {
  const mafiaAlive = alive.filter((id) => roles[id] === "mafia").length;
  const others = alive.length - mafiaAlive;
  if (mafiaAlive === 0) return "civ";
  if (mafiaAlive >= others) return "mafia";
  return null;
}
function mfRevealMap(room) {
  const out = {};
  Object.keys(room.players || {}).forEach((id) => { out[id] = MF.roles[id]; });
  return out;
}

async function mfResolveNight(room, alive) {
  const code = MF.code, roles = MF.roles, night = room.night || {}, day = room.day;
  const count = {};
  let saved = null, checkBy = null, checkT = null;
  alive.forEach((id) => {
    const x = night[id];
    if (!x || !x.t) return;
    if (roles[id] === "mafia" && x.act === "kill") count[x.t] = (count[x.t] || 0) + 1;
    if (roles[id] === "doctor" && x.act === "save") saved = x.t;
    if (roles[id] === "detective" && x.act === "check") { checkBy = id; checkT = x.t; }
  });
  let victim = null, best = 0;
  Object.keys(count).forEach((t) => { if (count[t] > best) { best = count[t]; victim = t; } });
  const killed = victim && victim !== saved && room.players[victim] && room.players[victim].alive === true ? victim : null;
  const aliveAfter = alive.filter((id) => id !== killed);
  const winner = mfWinner(aliveAfter, roles);
  const patch = {};
  if (killed) patch[`players/${killed}/alive`] = false;
  if (winner) Object.assign(patch, { phase: "over", winner, ends: 0, reveal: mfRevealMap(room), night: null, votes: null });
  else Object.assign(patch, { phase: "day", ends: Date.now() + MF_TIME.day * 1000, night: null, votes: null });
  await mfPatch(`rooms/${code}`, patch);
  if (checkBy && checkT) await mfPatch(`priv/${code}/${checkBy}/checks`, { [day]: { n: mfNameOf(checkT), r: roles[checkT] } });
  await mfLog(killed ? { k: "kill", d: day, n: mfNameOf(killed) } : (victim ? { k: "saved", d: day } : { k: "quiet", d: day }));
}

async function mfResolveVote(room, alive) {
  const code = MF.code, roles = MF.roles, votes = room.votes || {}, day = room.day;
  const count = {};
  alive.forEach((id) => { const v = votes[id]; if (v && v !== "skip") count[v] = (count[v] || 0) + 1; });
  let top = null, best = 0, tie = false;
  Object.keys(count).forEach((t) => {
    if (count[t] > best) { best = count[t]; top = t; tie = false; } else if (count[t] === best) tie = true;
  });
  const out = top && !tie && best * 2 > alive.length ? top : null;  // chiqarish uchun yarimdan ko'p ovoz kerak
  const aliveAfter = alive.filter((id) => id !== out);
  const winner = mfWinner(aliveAfter, roles);
  const patch = {};
  if (out) patch[`players/${out}/alive`] = false;
  if (winner) Object.assign(patch, { phase: "over", winner, ends: 0, reveal: mfRevealMap(room), votes: null });
  else Object.assign(patch, { phase: "night", day: day + 1, ends: Date.now() + MF_TIME.night * 1000, night: null, votes: null });
  await mfPatch(`rooms/${code}`, patch);
  await mfLog(out ? { k: "vote", d: day, n: mfNameOf(out), r: roles[out] } : { k: "novote", d: day });
}

/* ---- Mukofot (faqat g'olib tomon, bir o'yinda bir marta, kuniga cheklangan) ---- */
function mfRewardOnce(room) {
  if (!MF.role || !room.winner || room.gen == null) return;
  const key = NS + "mafia-rw-" + MF.code + "-" + room.gen;
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch (e) { /* ignore */ }
  const won = (room.winner === "mafia") === (MF.role === "mafia");
  if (!won) return;
  const today = new Date().toISOString().slice(0, 10);
  let rec = { d: today, n: 0 };
  try { const s = JSON.parse(localStorage.getItem(NS + "mafia-day") || "null"); if (s && s.d === today) rec = s; } catch (e) { /* ignore */ }
  if (rec.n >= MF_DAILY_CAP) return toast(mt("reward") && mtE("rewardCap", MF_DAILY_CAP) || "", "info");
  rec.n += 1;
  try { localStorage.setItem(NS + "mafia-day", JSON.stringify(rec)); } catch (e) { /* ignore */ }
  S.cafe.money += MF_REWARD;
  saveState();
  toast(mt("reward", fmt(MF_REWARD)), "good");
}

/* ---- Asosiy yangilash sikli (har 2 soniyada) ---- */
async function mfRefresh(force) {
  if (!MF.code || MF.busy || !mfUid()) return;
  MF.busy = true;
  try {
    const uid = mfUid(), code = MF.code;
    const room = await mfGet(`rooms/${code}`);
    if (!room) return mfForget(mtE("closed"));
    if (!room.players || !room.players[uid]) return mfForget(room.phase === "lobby" ? "" : mtE("kicked"));
    MF.room = room;
    if (!MF.roles && mfIsHost() && room.gen) {
      try { MF.roles = JSON.parse(localStorage.getItem(mfHostKey(code)) || "null"); } catch (e) { MF.roles = null; }
    }
    if (Date.now() - MF.seenAt > 6000) {
      MF.seenAt = Date.now();
      mfPatch(`rooms/${code}/players/${uid}`, { seen: Date.now() }).catch(() => {});
    }
    if (room.gen && room.phase !== "lobby") {
      const pv = await mfGet(`priv/${code}/${uid}`);
      MF.role = pv ? pv.role : null;
      MF.mates = pv && pv.mates ? pv.mates : [];
      MF.checks = pv && pv.checks ? pv.checks : {};
      MF.gen = room.gen;
    } else if (room.phase === "lobby") {
      MF.role = null; MF.mates = []; MF.checks = {};
    }
    const chatRaw = await mfGet(`chat/${code}`, 'orderBy="$key"&limitToLast=40');
    MF.chat = chatRaw ? Object.keys(chatRaw).sort().map((k) => Object.assign({ k }, chatRaw[k])) : [];
    if (mfIsHost() && room.phase !== "lobby" && room.phase !== "over") await mfHostStep(room);
    if (room.phase === "over") mfRewardOnce(room);
    const sig = JSON.stringify([room.phase, room.day, room.ends, room.winner || "", room.votes || {}, room.night ? Object.keys(room.night).length : 0,
      Object.keys(room.players).map((k) => [k, room.players[k].alive]), room.log ? Object.keys(room.log).length : 0,
      MF.role, MF.checks, MF.chat.length, MF.chat.length ? MF.chat[MF.chat.length - 1].k : "", MF.err, room.reveal ? 1 : 0, LANG]);
    if ((sig !== MF.sig || force) && ui.screen === "mf" && !isTyping()) { MF.sig = sig; render(); }
  } catch (e) {
    /* tarmoq uzilsa, keyingi urinishda qayta uriniladi */
  } finally { MF.busy = false; }
}

let mfTimerOn = false;
function mfStartPoll() {
  if (MF.poll) return;
  MF.poll = setInterval(() => { if (MF.code) mfRefresh(false); }, 2000);

    mfTimerOn = true;
    setInterval(() => {

        el.textContent = left + " s";

      ids.map((id) => `<div><span>${esc(players[id].name)}</span><b>${rev[id] ? mfRole(rev[id]).n : "?"}</b></div>`).join("") +
      `</div></section>` +

  const leave = `<div class="field mt">${btn(mt("leave"), "mf:leave", { small: true })}</div>`;

    : `<section class="panel"><h3>${mt("alive", alive.length, ids.length)}</h3>${mfPlayerRows(room, uid)}</section>`;
  return head + teamHead + roleCard + `<section class="panel"><h3>${mt("action")}</h3>${action}</section>` + tail + chatBlock + errHtml + leave;
}

/* ===================== ANIMATSIYA EFFEKTLARI ===================== */
function rippleAt(x, y) {
  const r = document.createElement("span");
  r.className = "ripple";
  r.style.left = x + "px";
  r.style.top = y + "px";
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 650);
}
function sparksAt(x, y) {
  const em = ["✨", "⭐", "💫", "🌟"];
  for (let i = 0; i < 7; i++) {
    const s = document.createElement("span");
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50;
    s.className = "spark";
    s.textContent = em[i % em.length];
    s.style.left = x - 9 + "px";
    s.style.top = y - 9 + "px";
    s.style.setProperty("--dx", Math.cos(a) * d + "px");
    s.style.setProperty("--dy", Math.sin(a) * d - 20 + "px");
    s.style.setProperty("--r", (Math.random() * 240 - 120) + "deg");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}
document.addEventListener("pointerdown", (e) => {
  if (e.target.closest("input")) return;
  rippleAt(e.clientX, e.clientY);
});

function feedHtml(list, empty, key) {
  if (!list.length) return `<div>${empty}</div>`;
  ui.seen = ui.seen || {};
  const seen = ui.seen[key] || (ui.seen[key] = new Set());
  const ids = list.map((f) => f.t + "|" + f.text);

  const html = list.map((f, i) => `<div${seen.has(ids[i]) ? "" : ' class="new"'}>• ${esc(f.text)}</div>`).join("");
  ids.forEach((id) => seen.add(id));
  return html;
}

    now - c.bonusAt >= DAY_MS, canSpin(c.spinAt), !!c.day,

    S.loans.map((x) => x.id + x.status + x.warned).join(","),
  ].join("|");
}

async function promoApply(game) {
  if (promoBusy) return;
  if (game === "club" && !S.club.open) {
    ui.err = { k: "promo", msg: "Avval game clubni oching" };
    return;
  }
  promoBusy = true;
  try {
    const r = await redeemPromo(game, ui.draft.promo);
    if (r.error) {
      ui.err = { k: "promo", msg: r.error };
    } else {
      ui.err = null;
      ui.draft.promo = "";
      saveState();
      toast(r.text, "good");
    }
  } catch (e) {
    ui.err = { k: "promo", msg: "❌ Xatolik: qayta urinib ko'ring" };
  } finally {
    promoBusy = false;
    render();
  }
}


function repayAct(id, mode) {
  const l = S.loans.find((x) => x.id === id);
  if (!l) return;
  const want = mode === "half" ? Math.max(1000, r1000(loanLeft(l) / 2)) : Infinity;
  const err = repayLoan(id, want);
  if (err) toast(err, "bad");
  else toast("💳 To'lov qabul qilindi", "good");
}

function loanAct(sub, val) {
  if (sub === "take") {
    const amount = Number(ui.draft.loanAmt);
    const days = Number(ui.draft.loanTerm) || 3;
    const err = takeLoan(amount, days);
    if (err) {
      ui.err = { k: "loan", msg: err };
    } else {
      ui.err = null;
      ui.draft.loanAmt = "";
      toast(`🏦 Kredit olindi: +${fmt(amount)}`, "good");
    }
    return;
  }
  repayAct(Number(val), sub);
}

function handleAct(act) {
  const parts = act.split(":");
  const verb = parts[0], a = parts[1], b = parts[2];
  if (isBanned() && !(verb === "go" || (verb === "reg" && a === "reset"))) return toast("🚫 Hisob bloklangan", "bad");
  const authVerb = verb === "set" || verb === "lb" || verb === "lbf" || verb === "reg" || verb === "signin" || verb === "authtab" || verb === "terms" || verb === "logout" || (verb === "go" && a === "acc");
  if (!loadAccount() && !authVerb) {
    toast("Avval hisob yarating: 👤 Hisob bo'limi", "bad");  // hisobsiz hech qanday amal bajarilmaydi
    return;
  }
  switch (verb) {
    case "go": if (a === "owner" && !isOwner()) break; ui.screen = a; ui.err = null; if (a === "acc") refreshReferrals(); if (a === "lb") fetchLB(); if (a === "mf") mfEnter(); break;
    case "owner": ownerAct(a, b); break;
    case "reg": if (a === "reset") resetAccount(); else doRegister(); break;
    case "signin": doSignIn(); break;
    case "authtab": ui.authTab = a; ui.err = null; break;
    case "terms": if (a === "toggle") toggleTerms(); break;
    case "ctab": ui.cTab = a; ui.err = null; break;
    case "ltab": ui.lTab = a; ui.err = null; break;
    case "set": setAct(a, b); break;
    case "auto": toggleAuto(a); break;
    case "lb": if (a === "refresh") fetchLB(); break;
    case "skin": skinAct(a, b); break;
    case "lbf": ui.lbF = a; break;
    case "mf": mfAct(a, b); break;
    case "modal": closeModal(); break;
    case "day": if (a === "start") beginDay("cafe"); break;
    case "buy": buyUpgrade(a); break;
    case "fire": fireStaff(); break;
    case "setpol": setCafePolicy(a); break;
    case "dish": buyDish(a); break;
    case "dprice": setDishPrice(a, ui.draft["pr_" + a]); break;
    case "bbuy": buyBoost(a); break;
    case "bonus": claimCafeBonus(); break;
    case "spin": spinCafe(); break;
    case "dep": if (a === "add") depositAdd(Number(b)); else depositOut(); break;
    case "loanterm": ui.draft.loanTerm = Number(a); break;
    case "loan": loanAct(a, b); break;
    case "quest": {
      const reward = claimQuest(Number(b));
      if (reward) toast(`🎁 Vazifa mukofoti: +${fmt(reward)}`, "good");
      break;
    }
    case "promo": promoApply(a); break;
    case "prest": if (a === "ask") askPrestige(); else doPrestige(); break;
    case "copen": openClub(); break;
    case "cday": if (a === "start") {
      if (!S.club.open) toast("Avval game clubni oching", "bad");
      else beginDay("club");
    } break;
    case "cbuy": buyClubUpgrade(a); break;
    case "csetpol": setClubPolicy(a); break;
    case "cbbuy": buyClubBoost(a); break;
    case "cbonus": claimClubBonus(); break;
    case "cspin": spinClub(); break;
    case "cdep": if (a === "add") clubDepositAdd(Number(b)); else clubDepositOut(); break;
    case "cquest": {
      const reward = claimClubQuest(Number(b));
      if (reward) toast(`🎁 Club vazifa mukofoti: +${fmt(reward)}`, "good");
      break;
    }
    case "cprest": if (a === "ask") askClubPrestige(); else doClubPrestige(); break;
    case "ref": if (a === "copy") copyRef(b); break;
    default: break;
  }
}

// Kun yakuni: kunni boshlagan tomon (owner) vaqtida yakunlaydi; ikkinchi tomon GRACE_MS kutadi (zaxira sifatida)
function dayDue(d, now) {
  if (!d || now < d.end) return false;
  return d.owner === "site" || now >= d.end + GRACE_MS;
}
function tick() {
  if (isBanned()) return;
  const now = Date.now();
  let changed = false;
  const cafeDue = dayDue(S.cafe.day, now), clubDue = dayDue(S.club.day, now);
  if ((cafeDue || clubDue) && syncOn() && now - sy.pullAt > 4000) { syncPull(); return; }  // avval botdagi yangi holat olinadi
  if (cafeDue) {
    const r = finishCafeDay();
    changed = true;
    if (r && !S.cafe.auto) showCafeResult(r);
  }
  if (clubDue) {
    const r = finishClubDay();
    changed = true;
    if (r && !S.club.auto) showClubResult(r);
  }
  const msgs = collectLoans(now);
  if (msgs.length) {
    changed = true;
    msgs.forEach((m) => toast(m.text, m.kind));
  }
  autoTick();
  if (Date.now() - LB_AT > 15000) { LB_AT = Date.now(); pushLB(); }
  const rk = readyKey();
  if (rk !== ui.rk) {
    ui.rk = rk;
    changed = true;
  }
  if (changed) {
    saveState();
    render();
  } else {
    updateLive();
  }
}

// Sayt va bot bir xil o'yin holatini Firebase Realtime Database orqali bo'lishadi (yo'l: /s/<kalit>).
// Kalit = sha256("sync:" + login + ":" + parol_xeshi)[:40], faqat parolni biladigan odam hosil qila oladi.
// Ketayotgan kun ham sinxronlanadi: qaysi tomonda boshlansa, ikkinchisida ham boshlanadi.
let FB_AUTH = null;  // { idToken, refreshToken, uid, exp } — Firebase Authentication sessiyasi
try { FB_AUTH = JSON.parse(localStorage.getItem(FBAUTH_KEY) || "null"); } catch (e) { FB_AUTH = null; }
function fbAuthSave(a) {
  FB_AUTH = a || null;
  try { if (a) localStorage.setItem(FBAUTH_KEY, JSON.stringify(a)); else localStorage.removeItem(FBAUTH_KEY); } catch (e) { /* xotira yopiq */ }
}
function fbUrl(path) {
  const base = FIREBASE_URL.replace(/\/+$/, "");
  if (!FB_AUTH || !FB_AUTH.idToken) return base + path;
  return base + path + (path.indexOf("?") >= 0 ? "&" : "?") + "auth=" + encodeURIComponent(FB_AUTH.idToken);
}
async function fbAuthCall(kind, login, pass) {
  const r = await fetchT("https://identitytoolkit.googleapis.com/v1/accounts:" + kind + "?key=" + FIREBASE_API_KEY, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: login + "@verox-games.app", password: pass, returnSecureToken: true }) });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return { idToken: j.idToken, refreshToken: j.refreshToken, uid: j.localId, exp: Date.now() + Number(j.expiresIn) * 1000 };
}
async function fbRefresh() {
  if (!FB_AUTH || !FB_AUTH.refreshToken) return false;
  const r = await fetchT("https://securetoken.googleapis.com/v1/token?key=" + FIREBASE_API_KEY, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(FB_AUTH.refreshToken) });
  if (!r.ok) return false;
  const j = await r.json();
  fbAuthSave({ idToken: j.id_token, refreshToken: j.refresh_token, uid: j.user_id, exp: Date.now() + Number(j.expires_in) * 1000 });
  return true;
}
// Token muddati tugayapti bo'lsa, yangilaydi
async function fbEnsure() {
  if (!FB_AUTH || !FB_AUTH.refreshToken) return;
  if (FB_AUTH.exp - Date.now() > 120000) return;
  await fbRefresh().catch(() => false);
}
function fbErrText(e) {
  const m = String((e && e.message) || "");
  if (/INVALID|NOT_FOUND|EMAIL_NOT|PASSWORD/.test(m)) return "❌ Login yoki parol noto'g'ri. Hisob yo'q bo'lsa, «Ro'yxatdan o'tish» ni tanlang.";
  if (/TOO_MANY/.test(m)) return "❌ Juda ko'p urinish. Keyinroq qayta urining";
  return PROMO_NET_MSG;
}
const FIREBASE_API_KEY = "AIzaSyC_RsK-D9VX1dnFHQHfLp6-dXm-aki3qwc";  // Firebase Web API key (ochiq kalit; xavfsizlik qoidalari bilan himoyalanadi)
const FIREBASE_URL = "https://verox-games-default-rtdb.europe-west1.firebasedatabase.app";  // botdagi FIREBASE_URL bilan BIR XIL
const SYNC_POLL_MS = 15000;   // jonli oqim uzilganda zaxira so'rov oralig'i
const LEAD_MS = 3000;         // kun boshlanishi: hozirdan shuncha ms keyin (sayt va botda bir xil)
const GRACE_MS = 60000;       // kunni boshlagan tomon yakunlamasa, ikkinchi tomon shuncha kutib yakunlaydi
let dayStarting = false;
let liveSrc = null, liveKey = null;  // Firebase jonli oqimi (EventSource)
const sy = { sig: "", pullAt: 0, pushT: null, busy: false, down: 0, ready: false, dirty: false };

function syncKey() { const a = loadAccount(); return a && a.key ? a.key : null; }
function syncOn() { return !!(FIREBASE_URL && syncKey()); }
function syncUrl() { return fbUrl("/s/" + syncKey() + ".json"); }
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function deriveSyncKey(login, hash) { return (await sha256Hex("sync:" + login + ":" + hash)).slice(0, 40); }
function durableOf(st) {
  return { cafe: Object.assign({}, st.cafe), club: Object.assign({}, st.club) };
}
function syncSig() { return JSON.stringify(durableOf(S)); }
function isPristine(c, k) { return !c.days && !k.open && c.money === CFG.START_MONEY && !(c.ach && c.ach.length) && !c.prestige; }
function progressOf(c, k) { return [(c.days || 0) + (k.days || 0), (c.money || 0) + (k.money || 0)]; }
function arr(v) { return Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []); }
// Firebase bo'sh ro'yxat va obyektlarni olib tashlaydi: yetishmaganlarini standart qiymat bilan to'ldiramiz
function normDay(d, club) {
  if (!d || typeof d !== "object" || !d.start || !d.end) return null;
  d.boosts = arr(d.boosts); d.ev = arr(d.ev); d.lost = arr(d.lost);
  if (club) {
    d.sess = arr(d.sess); d.lost = d.lost.map(arr);
    d.outage = d.outage ? arr(d.outage) : null;
  } else {
    d.cust = arr(d.cust).map((c) => Object.assign(c, { dishes: arr(c.dishes) }));
    d.special = d.special || null;
  }
  return d;
}
function normGame(r) {
  const c = Object.assign(newCafe(), r.cafe || {}), k = Object.assign(newClub(), r.club || {});
  for (const o of [c, k]) {
    o.boosts = arr(o.boosts); o.ach = arr(o.ach);
    o.promos = arr(o.promos).filter((x) => typeof x === "string");
    o.stats = o.stats && typeof o.stats === "object" ? o.stats : {};
    const q = o.quests && typeof o.quests === "object" ? o.quests : {};
    o.quests = { d: typeof q.d === "number" ? q.d : -1, q: arr(q.q).map(arr) };
  }
  c.day = normDay(c.day, false);
  k.day = normDay(k.day, true);
  c.dishes = arr(c.dishes).filter((d) => DISHES[d]);
  if (!c.dishes.length) c.dishes = ["choy"];
  const pr = c.prices && typeof c.prices === "object" ? c.prices : {};
  c.prices = {};
  for (const k of Object.keys(pr)) if (DISHES[k] && Number(pr[k]) > 0) c.prices[k] = Math.floor(Number(pr[k]));
  k.open = !!k.open;
  return { cafe: c, club: k };
}
// Bulutdan kelgan holat. Bizda ketayotgan kun bulutda yo'q bo'lsa: u boshqa tomonda yakunlangan bo'lsa (stats.last_day) natijasini
// ko'rsatamiz, aks holda kun yo'qolmasin deb uni saqlab qayta yuboramiz.
function applyRemote(g, rev) {
  let keep = false;
  for (const k of ["cafe", "club"]) {
    const loc = S[k].day, rem = g[k].day;
    if (!loc || rem) continue;
    const last = g[k].stats && g[k].stats.last_day;

      toast(`🏁 Kun ${last.no} boshqa qurilmada yakunlandi: ${last.profit >= 0 ? "+" : "−"}${fmt(Math.abs(last.profit))}`, last.profit >= 0 ? "good" : "bad");
    } else {
      g[k].day = loc;
      keep = true;
    }
  }
  S.cafe = g.cafe;   // ketayotgan kun ham (bot boshlagan bo'lsa) shu yerga o'tadi
  S.club = g.club;
  S.rev = keep ? Date.now() : (rev || 0);
  sy.sig = syncSig();
  saveState();
  if (keep) syncSchedule();
  const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (!typing && !ui.modalOpen) render();
}
function fetchT(url, opts) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), 6000);
  return fetch(url, Object.assign({ signal: ac.signal, cache: "no-store" }, opts || {})).finally(() => clearTimeout(t));
}
async function syncPull() {
  await fbEnsure();
  if (!syncOn() || sy.busy || Date.now() < sy.down) { if (!sy.busy) { sy.ready = true; sy.pullAt = Date.now(); } return; }
  sy.busy = true;
  try {
    const r = await fetchT(syncUrl());
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const mine = durableOf(S);
    if (!d || !d.cafe) { sy.ready = true; if (!S.rev) S.rev = Date.now(); syncPushNow(false); return; }
    const g = normGame(d), rRev = Number(d.rev) || 0, lRev = Number(S.rev) || 0;
    const rNew = isPristine(g.cafe, g.club), lNew = isPristine(mine.cafe, mine.club);
    let take = rRev > lRev;
    if (rNew && !lNew) take = false;               // bulutda yangi hisob, bizda o'yin bor: bizniki ustun
    else if (lNew && !rNew) take = true;           // bizda yangi hisob, bulutda o'yin bor: bulutniki ustun
    else if (!lRev && !rNew && !lNew) {            // birinchi ulanish, ikkala tomonda o'yin: ko'proq yutilgani qoladi
      const a = progressOf(g.cafe, g.club), b = progressOf(mine.cafe, mine.club);
      take = a[0] > b[0] || (a[0] === b[0] && a[1] > b[1]);
    }
    sy.ready = true;
    if (take) applyRemote(g, rRev);
    else if (lRev > rRev || (rNew && !lNew) || (!lRev && !rNew && !lNew)) { if (!S.rev) S.rev = Date.now(); syncPushNow(false); }
  } catch (e) { sy.down = Date.now() + 15000; sy.ready = true; }
  finally { sy.busy = false; sy.pullAt = Date.now(); }
}
function syncSchedule() {
  if (!syncOn()) return;
  sy.dirty = true;
  clearTimeout(sy.pushT);
  sy.pushT = setTimeout(() => syncPushNow(false), 1200);
}
async function syncPushNow(keep) {
  await fbEnsure();
  if (!syncOn() || !sy.ready || Date.now() < sy.down) return;
  clearTimeout(sy.pushT);
  const a = loadAccount(), d = durableOf(S);
  if (!S.rev) S.rev = Date.now();
  try {
    const body = JSON.stringify({ rev: S.rev, by: "site", login: a.login, uid: FB_AUTH ? FB_AUTH.uid : null, cafe: d.cafe, club: d.club });
    const r = keep ? await fetch(syncUrl(), { method: "PUT", body, keepalive: true }) : await fetchT(syncUrl(), { method: "PUT", body });
    if (!r.ok) throw new Error("HTTP " + r.status);
    sy.dirty = false;
  } catch (e) { sy.down = Date.now() + 15000; sy.pushT = setTimeout(() => syncPushNow(false), 16000); }
}
function syncStatusHtml(acc) {
  if (!FIREBASE_URL) return `<p class="hint">🔄 Bulut sinxronlashi hali sozlanmagan.</p>`;
  if (!acc.key) return `<p class="hint">🔄 Sinxronlashni yoqish uchun pastdagi «Boshqa hisob yaratish» tugmasi orqali shu login va parol bilan qayta kiring.</p>`;

// Bot o'zgarishini darhol olish: Firebase jonli oqimi (EventSource). Uzilsa, brauzer qayta ulanadi.
function syncLive() {
  const k = syncKey();
  if (!k || !FIREBASE_URL || typeof EventSource === "undefined") return;
  if (liveKey === k && liveSrc && liveSrc.readyState !== 2) return;  // 2 = CLOSED
  if (liveSrc) liveSrc.close();
  liveKey = k;
  try {
    const es = new EventSource(syncUrl());
    let t = null;
    const pull = () => { clearTimeout(t); t = setTimeout(() => syncPull(), 300); };  // bir necha o'zgarishni birga o'qiymiz
    es.addEventListener("put", pull);
    es.addEventListener("patch", pull);
    es.onerror = () => { if (es.readyState === 2) setTimeout(syncLive, 10000); };
    liveSrc = es;
  } catch (e) { liveSrc = null; }
}
function syncStart() {
  sy.sig = syncSig();
  if (!syncOn()) { sy.ready = true; return; }
  syncPull();
  syncLive();
  setInterval(() => { if (!document.hidden) { syncLive(); syncPull(); loadSiteRepl().then((c) => { if (c) render(); }); refreshReferrals(); flushRefClaim(); refreshBan(); } }, SYNC_POLL_MS);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (sy.dirty) syncPushNow(true); }
    else { syncLive(); syncPull(); }
  });
}

// ---- Statistika grafigi (oxirgi 30 kun) ----
function pushHist(obj, entry) { obj.hist = arr(obj.hist).concat([entry]).slice(-30); }
function histChart(game, title) {
  const h = arr(S[game].hist).slice(-14);
  if (!h.length) return `<section class="panel"><h3>${title}</h3><p class="hint">Birinchi kun yakunlangach grafik chiqadi.</p></section>`;
  const W = 320, H = 150, pad = 8;
  const max = Math.max(1, ...h.map((x) => Math.abs(x.p)));
  const gap = (W - pad * 2) / h.length, bw = gap * 0.7;
  let bars = "";
  h.forEach((x, i) => {
    const bh = Math.max(2, (Math.abs(x.p) / max) * (H - 32));
    const xx = pad + i * gap + (gap - bw) / 2, y = H - 18 - bh;
    const col = x.p >= 0 ? "#4ade80" : "#f87171";
    bars += `<rect x="${xx.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${col}"><title>Kun ${x.d}: ${fmt(x.p)}</title></rect>`;
    bars += `<text x="${(xx + bw / 2).toFixed(1)}" y="${H - 4}" font-size="9" text-anchor="middle" fill="#a99a88">${x.d}</text>`;
  });

function confetti() {
  if (isNoMotion()) return;
  const cv = document.createElement("canvas");
  cv.className = "confetti";
  cv.width = innerWidth; cv.height = innerHeight;
  document.body.appendChild(cv);
  const x = cv.getContext("2d");
  const colors = ["#f2b441", "#4ade80", "#60a5fa", "#f472b6", "#fde68a"];
  const P = Array.from({ length: 120 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * 200, vx: (Math.random() - 0.5) * 4, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 6, r: Math.random() * 6, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  const step = (now) => {
    x.clearRect(0, 0, cv.width, cv.height);
    P.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.r += 0.2; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (now - t0 < 2600) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

function nextEventLine() {
  if (activeEvent()) return "";
  const now = new Date(Date.now() + 5 * 3600000);  // Toshkent vaqti
  const y = now.getUTCFullYear();
  const today = Date.UTC(y, now.getUTCMonth(), now.getUTCDate());
  let best = null;
  for (const e of EVENTS) {
    const [m, d] = e.from.split("-").map(Number);
    for (const yy of [y, y + 1]) {
      const st = Date.UTC(yy, m - 1, d);
      if (st >= today) { if (!best || st < best.st) best = { e, st }; break; }
    }
  }
  if (!best) return "";
  const days = Math.round((best.st - today) / 86400000);
  return `<div class="event-soon">⏳ <span>${best.e.n}</span>: ${days} kundan keyin</div>`;
}

  ];

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: "VEROX GAMES" }).catch(() => {});
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "verox-kartochka.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("📸 Kartochka tayyor", "good");
  }, "image/png");
}

const UI_TR_PAT = Object.entries(UI_TR.ru).filter(([k]) => k.includes("{n}"));
const UI_TR_SUB = Object.keys(UI_TR.ru).filter((k) => k.length >= 12 && !k.includes("{n}")).sort((a, b) => b.length - a.length);
const UI_CORE = /^(\s*[^A-Za-zʻ’'‘ÀÖÇĞŞÜ0-9{]*)([\s\S]*?)(\s*)$/;
function trCore(core, lang) {
  const d = UI_TR[lang];
  if (d[core] !== undefined) return d[core];
  let out = core, hit = false;
  for (const [k] of UI_TR_PAT) {
    const re = new RegExp(k.split("{n}").map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("(\\d[\\d\\s.,]*)"));
    if (re.test(out)) { out = out.replace(re, (all, n) => d[k].replace("{n}", n.trim())); hit = true; }
  }
  for (const k of UI_TR_SUB) if (out.includes(k)) { out = out.split(k).join(d[k]); hit = true; }
  return hit ? out : null;
}
function trUI(str) {
  if (LANG === "uz" || !UI_TR[LANG]) return str;
  const m = String(str).match(UI_CORE);
  const out = m ? trCore(m[2].replace(/\s+/g, " ").trim(), LANG) : null;
  const txt = out === null ? String(str) : m[1] + out + m[3];
  const cur = LANG === "en" ? "sum" : "сум";
  return txt.replace(/\bso['’ʻ‘]m\b/g, cur);
}

/* ===================== O'ZBEK LOTIN ALIFBOSI (faqat uz rejimi, ekrandagi matn) ===================== */
// sh→ş, ch→ç, o'→ö, g'→ğ. Kod va tugmalar o'zgarmaydi: faqat ko'rinadigan matn (text node) almashtiriladi.
const UZ_APOS = "['’ʻ‘`]";
function uzLatin(str) {
  return String(str)
    .replace(/[Ss][Hh]/g, (m) => (m[0] === "S" ? "Ş" : "ş"))
    .replace(/[Cc][Hh]/g, (m) => (m[0] === "C" ? "Ç" : "ç"))
    .replace(new RegExp("[Oo]" + UZ_APOS, "g"), (m) => (m[0] === "O" ? "Ö" : "ö"))
    .replace(new RegExp("[Gg]" + UZ_APOS, "g"), (m) => (m[0] === "G" ? "Ğ" : "ğ"));
}
function uzFixText(n) {
  const tag = n.parentNode && n.parentNode.tagName;
  if (tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA") return;
  const v = n.nodeValue;
  const t = LANG === "uz" ? uzLatin(v) : trUI(v);
  if (t !== v) n.nodeValue = t;
}
function uzFixAttrs(el) {
  for (const attr of ["placeholder", "title"]) {
    const v = el.getAttribute(attr);
    if (!v) continue;
    const t = LANG === "uz" ? uzLatin(v) : trUI(v);
    if (t !== v) el.setAttribute(attr, t);
  }
}
function uzFixNode(root) {
  if (!root) return;
  if (root.nodeType === 3) return uzFixText(root);
  if (root.nodeType === 1) uzFixAttrs(root);
  if (root.nodeType !== 1 && root.nodeType !== 9) return;
  if (root.querySelectorAll) root.querySelectorAll("[placeholder],[title]").forEach(uzFixAttrs);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) uzFixText(n);
}
function uzWatch() {
  uzFixNode(document.body);
  new MutationObserver((muts) => {
    for (const m of muts) m.addedNodes.forEach((n) => uzFixNode(n));
  }).observe(document.body, { childList: true, subtree: true });
}
